<body>
<div id="wrap"><div id="stage">

};

  fire:['Fire','Burns what it hits'],water:['Water','Slows what it hits'],earth:['Earth','Heavy shot with splash'],wind:['Wind','Weak but very fast'],

  // ★1
  fire:    {name:'火',      t:1,c:'#ff6a3d',kind:'bolt', dmg:7,  rate:1,   range:105,dot:3,dotT:2,              desc:'当てた敵を燃やす'},

    PATHS.push({pts,seg,len})}
  const end=st.paths[0][st.paths[0].length-1];CORE.x=end[0];CORE.y=end[1];
  slots.length=0;
  for(const[x,y]of st.field)slots.push({x,y,field:true,item:null});

}

function buildWave(w){
  const q=[];let t=0;
  const add=(type,n,gap,m=1)=>{for(let i=0;i<n;i++){q.push({type,at:t,m});t+=gap}};
  const gap=Math.max(.38,.95-w*.028);
  if(w>=3&&w%3===0){add('mite',8+w,gap*.38);t+=1}
  add('shade',5+w,gap);
  if(w>=2)add('wisp',1+(w>>1),gap*.7);
  if(w>=4)add('golem',Math.floor(w/3),gap*1.6);
  if(w%5===0){t+=1;add('boss',1,1,w>=20?2.2:w===5?.75:1)}
  return q;
}

let AC=null,noiseBuf=null;
function audio(){
  if(AC||muted)return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){}
}
function tone(f,d,type='sine',v=.1,to=null,delay=0){
  if(!AC||muted||!FX)return;
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,v=.1,freq=1200,delay=0){
  if(!AC||muted||!FX)return;
  const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(120,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+d);
}

function orb(id,named){

  const d=ITEMS[id],R=40,k=3;c=document.createElement('canvas');c.width=c.height=R*2*k;
  const g=c.getContext('2d');g.scale(k,k);g.translate(R,R);
  if(named){ // 名前は玉の下に小さく
    g.font=FONT(10.5,800);g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
    g.lineWidth=3;g.strokeStyle='#05040a';g.strokeText(nm(d),0,27.5);g.fillStyle='#ece7f7';g.fillText(nm(d),0,27.5);
    g.translate(0,-6);g.scale(.86,.86);
  }
  let gr=g.createRadialGradient(0,0,14,0,0,38);gr.addColorStop(0,rgba(d.c,.45));gr.addColorStop(1,rgba(d.c,0));
  g.fillStyle=gr;g.fillRect(-R,-R,R*2,R*2);
  gr=g.createRadialGradient(-6,-8,2,0,0,25);gr.addColorStop(0,'#2a2444');gr.addColorStop(1,'#07060d');
  g.fillStyle=gr;g.beginPath();g.arc(0,0,24,0,TAU);g.fill();
  g.strokeStyle=d.c;g.lineWidth=2;g.stroke();
  g.lineWidth=1;g.globalAlpha=.55;
  if(d.t>=2){g.beginPath();g.arc(0,0,20,0,TAU);g.stroke()}
  if(d.t>=3){for(let i=0;i<6;i++){const a=i/6*TAU;g.beginPath();g.moveTo(Math.cos(a)*20,Math.sin(a)*20);g.lineTo(Math.cos(a)*24,Math.sin(a)*24);g.stroke()}}
  if(d.t>=4){for(let j=0;j<2;j++){g.beginPath();for(let i=0;i<4;i++){const a=i/4*TAU+j*TAU/8;g[i?'lineTo':'moveTo'](Math.cos(a)*27,Math.sin(a)*27)}g.closePath();g.stroke()}}
  if(d.t>=5){g.strokeStyle='#ffe9a0';g.globalAlpha=.9;g.beginPath();g.arc(0,0,29,0,TAU);g.stroke();
    for(let i=0;i<12;i++){const a=i/12*TAU;g.beginPath();g.moveTo(Math.cos(a)*30,Math.sin(a)*30);g.lineTo(Math.cos(a)*(i%2?34:38),Math.sin(a)*(i%2?34:38));g.stroke()}}
  g.globalAlpha=1;g.lineWidth=2;g.lineJoin='round';g.lineCap='round';g.strokeStyle=d.c;g.fillStyle=d.c;
  g.shadowColor=d.c;g.shadowBlur=7;g.scale(1.08,1.08);

function dropOn(from,to){
  const it=from.item;if(!it)return;
  if(!to||to===from){sfx.drop();return}
  if(!to.item){
    if(!fits(it.id,to)){it.shake=.35;sfx.fail();floatText(to.x,to.y-30,TT(to.path?'onlyTrap':'trapOnPath'),'#b9b1d0',13);return}
    to.item=it;from.item=null;it.s=1.3;it.sv=-2;it.cd=Math.max(it.cd,.15);
    sfx.drop();ring(to.x,to.y,ITEMS[it.id].c,38,.3,2);buzz(8);
    if(!to.bench)S.started=true;
    return;
  }
  const res=tryCombine(it,to.item);
  if(res.fail){
    it.shake=.35;to.item.shake=.35;sfx.fail();buzz([10,40,10]);
    floatText(to.x,to.y-34,res.fail,'#b9b1d0',13);return;
  }
  // できたものが置けない場所なら、運んできた側のマスに残す
  const dst=fits(res.id,to)?to:fits(res.id,from)?from:null;
  if(!dst){it.shake=.35;sfx.fail();floatText(to.x,to.y-34,TT('mergeOnBench'),'#b9b1d0',13);return}
  const n=mkItem(res.id,dst.x,dst.y);n.hide=.3;n.s=.01;
  const isNew=!disc.has(res.id);
  if(isNew){disc.add(res.id);save()}
  if(FX)fx.push({ty:'merge',x:dst.x,y:dst.y,a:{id:it.id,x:it.rx,y:it.ry},b:{id:to.item.id,x:to.item.rx,y:to.item.ry},t:0,dur:.3,res:n,isNew});
  else n.hide=0,n.s=1;
  from.item=null;to.item=null;dst.item=n;
}

function startWave(){
  if(S.active||S.over||(S.cleared&&!S.endless))return;
  S.wave++;S.active=true;S.wt=0;S.started=true;
  S.queue=buildWave(S.wave);
  S.wsum=S.queue.reduce((a,q)=>a+ENEMY[q.type].w,0);S.budget=26+9*S.wave;
  sfx.wave();if(FX)fx.push({ty:'wave',t:0,dur:1.6,n:S.wave});
}
function spawnEnemy(q){
  const d=ENEMY[q.type],hp=d.hp*waveHp(S.wave)*q.m;
  const P=PATHS[S.spawned++%PATHS.length];
  S.enemies.push({type:q.type,def:d,P,hp,max:hp,d:0,x:P.pts[0][0],y:P.pts[0][1],r:d.r*(q.m>1?1.25:1),
    slow:0,slowT:0,dot:0,dotT:0,dotC:'#fff',curse:1,curseT:0,flash:0,ph:rnd(TAU),reward:S.budget*d.w/S.wsum,dead:false});
}
function hurt(e,dmg){
  if(e.dead)return;
  e.hp-=dmg*(e.curseT>0?e.curse:1);e.flash=.08;
  if(e.hp<=0)kill(e);
}
function applyHit(e,d,m,color){
  if(e.dead)return;
  if(d.knock&&e.type!=='boss'&&!(e.knT>0)){e.d=Math.max(0,e.d-d.knock);e.knT=.8}
  if(d.curse&&d.curse>=e.curse-.001){e.curse=d.curse;e.curseT=4}
  if(d.slow&&(d.slow>=e.slow||e.slowT<=0)){e.slow=d.slow;e.slowT=d.slowT}
  if(d.dot&&(d.dot*m>=e.dot||e.dotT<=0)){e.dot=d.dot*m;e.dotT=d.dotT;e.dotC=color}
}
function kill(e){
  e.dead=true;S.mana+=e.reward;
  if(!FX)return;
  const boss=e.type==='boss';
  burst(e.x,e.y,e.def.rim,boss?50:10,boss?260:110);burst(e.x,e.y,'#1a1230',6,60,{ty:'d'});
  if(boss){ring(e.x,e.y,'#ff3b6b',140,.7,5);ring(e.x,e.y,'#ffffff',90,.4,2);sparks(e.x,e.y,'#ffd0d8',40,380);shake(12);sfx.boom();S.flash=.3;S.flashC='#ff3b6b'}
  else sfx.kill();
  const n=boss?12:Math.min(3,1+(e.reward/6|0));
  for(let i=0;i<n;i++)fx.push({ty:'mana',x:e.x,y:e.y,cx:e.x+rnd(-60,60),cy:e.y+rnd(-70,-20),t:-i*.05,dur:rnd(.5,.75)});
}
function leak(e){
  e.dead=true;S.lives-=e.def.life;S.coreHit=1;
  shake(8);S.flash=.3;S.flashC='#ff2a4a';sfx.leak();buzz(60);
  burst(CORE.x,CORE.y,'#ff2a4a',24,180);ring(CORE.x,CORE.y,'#ff2a4a',80,.5,4);
  if(S.lives<=0&&!S.over){S.lives=0;gameOver()}
}
function inRange(x,y,R,max){ // 射程内の敵を、ゴールに近い順に
  const a=[];
  for(const e of S.enemies){if(e.dead)continue;const dx=e.x-x,dy=e.y-y;if(dx*dx+dy*dy<=(R+e.r)*(R+e.r))a.push(e)}
  a.sort((p,q)=>(p.P.len-p.d)-(q.P.len-q.d));return max?a.slice(0,max):a;
}
function towerFire(sl,it,dt){
  const d=ITEMS[it.id],m=1,R=d.range,x=sl.x,y=sl.y;
  if(d.kind==='beam'){
    const ts=inRange(x,y,R,d.beams);it.beamT=ts;
    for(const e of ts){applyHit(e,d,m,d.c);hurt(e,d.dmg*m*dt);if(FX&&Math.random()<dt*14)sparks(e.x,e.y,d.c,1,90)}
    if(ts.length){it.kick=Math.max(it.kick,.35);if(Math.random()<dt*6)sfx.shot(1400)}
    return;
  }
  it.cd-=dt;if(it.cd>0)return;
  let ts=inRange(x,y,R);if(!ts.length){it.cd=0;return}
  it.cd+=1/d.rate;if(it.cd<0)it.cd=0;it.kick=1;
  if(d.kind==='pulse'){
    for(const e of ts){applyHit(e,d,m,d.c);hurt(e,d.dmg*m)}
    ring(x,y,d.c,R,.45,3,10);if(FX)burst(x,y,d.c,6,R*1.6,{drag:3});sfx.shot(300);return;
  }
  // 毒・氷・呪いは、まだ効いていない敵を先に狙う
  let tg=ts[0];
  if(d.kind==='bolt'&&(d.dot||d.slow||d.curse)){
    tg=ts.find(e=>d.curse?e.curseT<=0:d.slow?e.slowT<=0:e.dotT<=0)||ts[0];
  }
  if(d.kind==='chain'){
    const hit=[tg];let cur=tg,dm=d.dmg*m;const pts=[[x,y],[tg.x,tg.y]];
    applyHit(tg,d,m,d.c);hurt(tg,dm);
    for(let i=1;i<d.chain;i++){
      let bestE=null,bd=95*95;
      for(const e of S.enemies){if(e.dead||hit.includes(e))continue;const q=(e.x-cur.x)**2+(e.y-cur.y)**2;if(q<bd){bd=q;bestE=e}}
      if(!bestE)break;dm*=.85;hit.push(bestE);pts.push([bestE.x,bestE.y]);applyHit(bestE,d,m,d.c);hurt(bestE,dm);cur=bestE;
    }
    if(FX){fx.push({ty:'zap',pts,color:d.c,t:0,dur:.18,seed:rnd(99)});for(const p of pts.slice(1))sparks(p[0],p[1],d.c,3,120)}
    sfx.shot(1800);return;
  }
  if(d.kind==='pierce'){
    const a=Math.atan2(tg.y-y,tg.x-x),L=R*1.25,ex=x+Math.cos(a)*L,ey=y+Math.sin(a)*L;
    for(const e of S.enemies){if(e.dead)continue;
      const k=clamp(((e.x-x)*(ex-x)+(e.y-y)*(ey-y))/(L*L),0,1),px=x+(ex-x)*k,py=y+(ey-y)*k;
      if((e.x-px)**2+(e.y-py)**2<(e.r+9)**2){applyHit(e,d,m,d.c);hurt(e,d.dmg*m);if(FX)sparks(e.x,e.y,d.c,3,140)}}
    if(FX)fx.push({ty:'line',x,y,ex,ey,color:d.c,t:0,dur:.25});sfx.shot(500);return;
  }
  S.shots.push({x,y,tx:tg.x,ty:tg.y,tg,d,m,spd:d.fast?900:d.splash?330:480});
  sfx.shot(d.splash?220:900);
}
function shotHit(s){
  const d=s.d,dm=d.dmg*s.m;
  if(d.splash){
    for(const e of S.enemies){if(e.dead)continue;if((e.x-s.x)**2+(e.y-s.y)**2<(d.splash+e.r)**2){applyHit(e,d,s.m,d.c);hurt(e,dm)}}
    ring(s.x,s.y,d.c,d.splash,.3,3);burst(s.x,s.y,d.c,d.t*5+4,d.splash*4,{drag:4});if(d.t>=4)shake(2.5);
  }else if(s.tg&&!s.tg.dead){
    applyHit(s.tg,d,s.m,d.c);hurt(s.tg,dm);
    if(FX){sparks(s.x,s.y,d.c,d.fast?10:2,d.fast?260:110);if(d.fast)ring(s.x,s.y,d.c,26,.25,2)}
  }
}
function update(dt){
  S.time+=dt;
  if(S.active){
    S.wt+=dt;
    while(S.queue.length&&S.queue[0].at<=S.wt)spawnEnemy(S.queue.shift());
  }
  for(const e of S.enemies){
    if(e.dead)continue;
    if(e.knT>0)e.knT-=dt;
    if(e.slowT>0)e.slowT-=dt;if(e.curseT>0){e.curseT-=dt;if(e.curseT<=0)e.curse=1}
    if(e.dotT>0){e.dotT-=dt;hurt(e,e.dot*dt);if(e.dead)continue;e.flash=0;if(FX&&Math.random()<dt*5)P(e.x+rnd(-e.r,e.r),e.y,0,-30,.5,3,e.dotC)}
    if(e.flash>0)e.flash-=dt;
    e.d+=e.def.spd*(e.slowT>0?1-e.slow:1)*dt;
    if(e.d>=e.P.len){leak(e);continue}
    const p=pathPoint(e.P,e.d);e.x=p[0];e.y=p[1];
  }
  for(const sl of slots){
    const it=sl.item;if(!it)continue;
    if(it.hide>0||it.held||sl.bench){it.beamT.length=0;continue}
    if(sl.path){ // 罠：上を通る敵にかかり続ける
      const d=ITEMS[it.id];
      for(const e of S.enemies){if(!e.dead&&(e.x-sl.x)**2+(e.y-sl.y)**2<(d.range+e.r*.5)**2)applyHit(e,d,1,d.c)}
      continue;
    }
    towerFire(sl,it,dt);
  }
  for(const s of S.shots){
    if(s.tg&&!s.tg.dead){s.tx=s.tg.x;s.ty=s.tg.y}
    const dx=s.tx-s.x,dy=s.ty-s.y,l=Math.hypot(dx,dy),st=s.spd*dt;
    if(l<=st+4){s.x=s.tx;s.y=s.ty;shotHit(s);s.done=true}
    else{s.x+=dx/l*st;s.y+=dy/l*st;if(FX&&Math.random()<.6)P(s.x,s.y,rnd(-15,15),rnd(-15,15),.25,s.d.splash?5:3,s.d.c)}
  }
  S.shots=S.shots.filter(s=>!s.done);
  S.enemies=S.enemies.filter(e=>!e.dead);
  if(S.active&&!S.queue.length&&!S.enemies.length&&!S.over)endWave();
}

  // 入口の裂け目
  for(const P of PATHS){const y=P.pts[0][1];gr=g.createRadialGradient(0,y,0,0,y,60);gr.addColorStop(0,rgba('#b03cff',.55));gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,y-65,70,130)}

  for(let i=fx.length-1;i>=0;i--)if(fx[i].t>=fx[i].dur&&fx[i].ty!=='text'&&fx[i].ty!=='wave')fx.splice(i,1);
  // パーティクル
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();continue}
    const dr=Math.exp(-p.drag*dt);p.vx*=dr;p.vy=p.vy*dr+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    const k=p.life/p.max,a=p.tw?k*(.6+.4*Math.sin(T*30+i)):k;
    if(p.ty==='g'){const z=p.size*(1.2+k)*2;ctx.globalAlpha=a;ctx.drawImage(glow(p.color),p.x-z/2,p.y-z/2,z,z)}
    else if(p.ty==='s'){ctx.globalAlpha=a;ctx.strokeStyle=p.color;ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.05,p.y-p.vy*.05);ctx.stroke()}
    else if(p.ty==='c'){p.rot+=p.vr*dt;p.vx+=Math.sin(T*3+i)*40*dt;ctx.globalCompositeOperation='source-over';ctx.globalAlpha=Math.min(1,k*3);
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.cos(p.rot*1.7));ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size/1.5);ctx.restore();ctx.globalCompositeOperation='lighter'}
    else{ctx.globalCompositeOperation='source-over';ctx.globalAlpha=k*.7;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(2-k),0,TAU);ctx.fill();ctx.globalCompositeOperation='lighter'}
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // 画面下の操作部
  drawHud(dt);
  drawShop(dt);
  for(const b of buttons)drawBtn(b,dt);
  // 説明の帯（選んでいる・運んでいる元素）
  const inf=held?held.item:sel&&sel.item;
  if(inf){const d=ITEMS[inf.id];ctx.fillStyle='#07060dd0';rr(ctx,40,50,W-80,26,13);ctx.fill();ctx.strokeStyle=rgba(d.c,.5);ctx.lineWidth=1;ctx.stroke();
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=FONT(13);ctx.fillStyle=d.c;ctx.fillText(`${nm(d)} ${'★'.repeat(d.t)} ― ${ds(d)}`,W/2,63.5)}
  // 最初の手引き
  if(!S.started&&!held&&S.wave===0){const a=.55+.35*Math.sin(T*3);ctx.textAlign='center';ctx.font=FONT(13.5);ctx.fillStyle=rgba('#e9e4f5',a);
    ctx.fillText(TT('hint'),W/2,508)}

  if(held){const it=held.item,y=ptr.y-(held.touch?26:0);it.rx=ptr.x;it.ry=y;
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.5;ctx.drawImage(glow(ITEMS[it.id].c),ptr.x-48,y-48,96,96);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    drawItem(it,ptr.x,y,1.22);if(Math.random()<.5)P(ptr.x+rnd(-14,14),y+rnd(-14,14),rnd(-20,20),rnd(10,50),.4,3,ITEMS[it.id].c)}
  else if(drag){drag.item.rx=drag.slot.x;drag.item.ry=drag.slot.y}
  // 浮かぶ文字
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];
    if(f.ty==='text'){const k=f.t/f.dur;if(k>=1){fx.splice(i,1);continue}
      const s=k<.15?.6+k/.15*.5:1.1-Math.min(.1,(k-.15)*.5);ctx.save();ctx.translate(f.x,f.y-k*26);ctx.scale(s,s);ctx.globalAlpha=k>.7?(1-k)/.3:1;
      ctx.font=FONT(f.size,800);ctx.lineWidth=4;ctx.strokeStyle='#05040acc';ctx.strokeText(f.txt,0,0);ctx.fillStyle=f.color;ctx.fillText(f.txt,0,0);ctx.restore()}
    else if(f.ty==='wave'){if(f.t<0)continue;const k=f.t/f.dur;if(k>=1){fx.splice(i,1);continue}
      const a=k<.2?k/.2:k>.7?(1-k)/.3:1,ox=(1-Math.min(1,k/.2))**3*-160+(k>.7?((k-.7)/.3)**3*160:0);
      ctx.globalAlpha=a;ctx.fillStyle='#05040a99';ctx.fillRect(0,282,W,56);ctx.fillStyle='#ff3b6b';ctx.fillRect(0,282,W,1);ctx.fillRect(0,337,W,1);
      ctx.font=FONT(30,800);ctx.fillStyle='#ffd0d8';ctx.fillText(f.txt||TT('waveN',f.n)+(f.n%5===0?TT('bossTag'):''),W/2+ox,311);ctx.globalAlpha=1}
  }
  ctx.restore();
  // 新発見の幕
  if(S.banner){const b=S.banner;b.t+=dt;const k=b.t/b.dur;
    if(k>=1)S.banner=null;else{const d=ITEMS[b.id],a=k<.12?k/.12:k>.85?(1-k)/.15:1,e=Math.min(1,b.t/.35),sc=1+(1-e)**2*1.6;

      ctx.save();ctx.translate(W/2,262);ctx.globalCompositeOperation='lighter';
      for(let i=0;i<14;i++){const an=i/14*TAU+T*.7;ctx.fillStyle=rgba(d.c,.09);ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,190,an,an+.13);ctx.fill()}
      ctx.drawImage(glow(d.c),-100,-100,200,200);ctx.globalCompositeOperation='source-over';

      ctx.textAlign='center';ctx.font=FONT(14,800);ctx.fillStyle='#e8c36a';ctx.fillText(TT('newFound'),W/2,192);
      ctx.font=FONT(28,800);ctx.fillStyle=d.c;ctx.fillText(nm(d),W/2,340);ctx.font=FONT(13);ctx.fillStyle='#cfc8e6';ctx.fillText(ds(d),W/2,366);
      ctx.font=FONT(12.5,800);ctx.fillStyle='#e8c36a';ctx.fillText(TT('buyNext',itemValue(d)),W/2,394);ctx.globalAlpha=1}}
  if(S.flash>0){ctx.globalCompositeOperation='lighter';ctx.fillStyle=rgba(S.flashC,Math.min(.7,S.flash));ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';S.flash-=dt*1.6}
  S.shake*=Math.exp(-dt*9);S.manaBump*=Math.exp(-dt*10);if(S.manaErr>0)S.manaErr-=dt;
}

/* ---------------- メインループ ---------------- */
let last=performance.now(),ambT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const paused=$('#title').classList.contains('on')||$('#codex').classList.contains('on')||$('#stages').classList.contains('on');
  if(!paused&&!S.over){
    if(S.slowmo>0)S.slowmo-=dt;
    let sim=dt*S.speed*(S.slowmo>0?.2:1);
    while(sim>0){const st=Math.min(sim,1/30);update(st);sim-=st}
    if(S.cleared&&!S.endless)celebrate(dt);
    else if(S.allFound>0&&!S.banner){ // 全種発見：花火と紙吹雪
      S.allFound-=dt;S.rocketT-=dt;
      if(S.rocketT<=0){S.rocketT=rnd(.12,.35);fx.push({ty:'rocket',x:rnd(40,W-40),y:H+10,ty2:rnd(90,420),vx:rnd(-30,30),color:pick(FW),t:0,dur:rnd(.55,.9)})}
      if(Math.random()<dt*40)confetti(rnd(W),-10);
    }
  }
  ambT-=dt;if(ambT<=0){ambT=.12;P(rnd(W),rnd(60,515),rnd(-6,6),rnd(-14,-4),rnd(2,4),rnd(1.5,3),Math.random()<.5?'#8b5cf6':'#4a3a9a',{drag:0,tw:1})}
  render(dt);
  requestAnimationFrame(frame);
}
