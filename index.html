<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ALCHEMERGE: RAGNAROK | 5段階進化×神話覚醒ディフェンス</title>
<style>
  :root {
    --bg: #03050a;
    --gold: #fde047;
    --fire: #f97316;
    --ice: #38bdf8;
    --bolt: #c084fc;
    --crimson: #f43f5e;
    --text: #f8fafc;
    --sub: #94a3b8;
  }
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100dvh; max-height: 100dvh;
    overflow: hidden;
    background: #020307;
    color: var(--text);
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    touch-action: none;
  }

  .game-frame {
    position: relative;
    width: 100%; max-width: 500px; height: 100dvh;
    margin: 0 auto;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 6px) 8px env(safe-area-inset-bottom, 8px) 8px;
    gap: 6px;
    background:
      radial-gradient(circle at 50% 18%, rgba(244, 63, 94, 0.22) 0%, transparent 55%),
      radial-gradient(circle at 50% 75%, rgba(56, 189, 248, 0.18) 0%, transparent 60%),
      linear-gradient(180deg, #090d1e 0%, #03050a 100%);
    box-shadow: 0 0 60px rgba(0,0,0,0.95);
  }

  /* Full-Screen Additive Blending VFX Canvas */
  canvas#fxCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 45;
  }

  #screenFlash {
    position: absolute; inset: 0;
    background: #fff; opacity: 0;
    pointer-events: none; z-index: 44;
    transition: opacity 0.08s ease-out;
  }

  /* 1. Top HUD Bar (44px) */
  header.hud-bar {
    height: 44px; flex-shrink: 0;
    background: linear-gradient(180deg, #1e293b 0%, #090d18 100%);
    border: 1px solid rgba(253, 224, 71, 0.35);
    border-bottom: 3px solid #02040a;
    border-radius: 11px; padding: 0 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 5px;
    z-index: 10;
    box-shadow: 0 4px 14px rgba(0,0,0,0.65);
  }
  .wave-tag {
    background: linear-gradient(135deg, #e11d48, #7c3aed);
    border: 1px solid #fde047;
    border-radius: 7px; padding: 3px 8px;
    font-size: 11px; font-weight: 900; letter-spacing: 0.5px; white-space: nowrap;
    box-shadow: 0 0 12px rgba(225, 29, 72, 0.6);
  }
  .hp-pill {
    display: flex; align-items: center; gap: 4px;
    background: #050811; border: 1px solid #334155;
    border-radius: 99px; padding: 2px 7px 2px 5px;
  }
  .hp-track { width: 52px; height: 8px; background: #1e293b; border-radius: 99px; overflow: hidden; }
  .hp-fill { height: 100%; background: linear-gradient(90deg, #10b981, #34d399); transition: width 0.2s; }
  .hp-txt { font-size: 10px; font-weight: 900; color: #6ee7b7; }

  .res-group { display: flex; align-items: center; gap: 5px; }
  .res-box {
    background: #050811; border: 1px solid #334155;
    border-radius: 8px; padding: 3px 7px;
    font-size: 11.5px; font-weight: 900; display: flex; align-items: center; gap: 3px;
  }
  .res-box.gold { border-color: rgba(253, 224, 71, 0.55); color: var(--gold); }

  .util-group { display: flex; gap: 4px; }
  .u-btn {
    background: linear-gradient(180deg, #334155, #0f172a);
    color: #fff; border: 1px solid #64748b; border-bottom: 2px solid #02040a;
    border-radius: 7px; padding: 4px 6px; font-size: 10.5px; font-weight: 900; cursor: pointer;
  }
  .u-btn.active { background: linear-gradient(180deg, #0284c7, #1e3a8a); border-color: #7dd3fc; }

  /* 2. Illustrated Dark-Fantasy Battle Stage (~36% height) */
  .battle-viewport {
    flex: 0 1 36%; min-height: 140px; max-height: 235px;
    position: relative; border-radius: 14px;
    border: 2px solid #64748b; overflow: hidden;
    background: #04060e;
    box-shadow: 0 6px 26px rgba(0,0,0,0.85), inset 0 0 40px rgba(0,0,0,0.7);
    z-index: 5;
  }
  canvas#battleCanvas { width: 100%; height: 100%; display: block; }

  .stage-hud {
    position: absolute; top: 5px; left: 6px; right: 6px;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    pointer-events: none; z-index: 15;
  }
  .coach-bar {
    flex: 1; min-width: 0;
    background: rgba(4, 6, 14, 0.86); backdrop-filter: blur(5px);
    border: 1px solid rgba(253, 224, 71, 0.55);
    border-radius: 99px; padding: 2.5px 8px 2.5px 4px;
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 900; color: #f0f9ff;
  }
  .coach-tag {
    background: linear-gradient(135deg, #fde047, #f97316);
    color: #04060e; font-size: 9px; font-weight: 900;
    padding: 1.5px 6px; border-radius: 99px; white-space: nowrap;
  }
  .coach-msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mob-counter {
    background: rgba(4, 6, 14, 0.9); border: 1px solid #f43f5e;
    border-radius: 99px; padding: 2.5px 8px;
    font-size: 10px; font-weight: 900; color: #fda4af; white-space: nowrap;
  }

  /* Full-Art Diagonal Evolution & Slash Cut-In */
  .slash-cutin {
    position: absolute; left: -125%; top: 50%;
    transform: translateY(-50%) skewY(-5deg);
    width: 112%; height: 96px;
    background: linear-gradient(90deg, rgba(4,6,14,0.96) 5%, rgba(225,29,72,0.94) 45%, rgba(124,58,237,0.96) 85%, rgba(4,6,14,0.96));
    border-top: 3px solid #fde047; border-bottom: 3px solid #fde047;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    z-index: 38; pointer-events: none;
    transition: left 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 45px rgba(244, 63, 94, 0.95);
    overflow: hidden;
    padding: 0 18px;
  }
  .slash-cutin.active { left: -6%; }
  .cutin-evo-pair {
    display: flex; align-items: center; gap: 5px; flex-shrink: 0;
  }
  .cutin-prev {
    width: 46px; height: 46px; border-radius: 50%;
    border: 1.5px solid #94a3b8;
    object-fit: cover; opacity: 0.82;
  }
  .cutin-arrow {
    font-size: 14px; font-weight: 900; color: #fde047;
    text-shadow: 0 0 8px #f97316;
  }
  .cutin-portrait {
    width: 78px; height: 78px; border-radius: 50%;
    border: 3px solid #fde047;
    object-fit: cover; flex-shrink: 0;
    box-shadow: 0 0 22px #fde047;
  }
  .cutin-info { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .cutin-sub {
    font-size: 10px; font-weight: 900; color: #fde047;
    letter-spacing: 0.8px; text-shadow: 0 1px 4px #000;
    white-space: nowrap;
  }
  .cutin-txt {
    font-size: 14.5px; font-weight: 900; color: #fff;
    text-shadow: 0 0 14px #fde047, 0 2px 6px #000;
    font-style: italic; white-space: nowrap;
  }

  /* 3. 4x3 Evolution Hero Card Board */
  .board-wrap {
    flex: 1 1 49%; min-height: 0;
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.92) 0%, rgba(4, 6, 14, 0.98) 100%);
    border: 1.5px solid rgba(148, 163, 184, 0.32);
    border-radius: 14px; padding: 5px 6px 6px 6px;
    display: flex; flex-direction: column; gap: 4px;
    z-index: 10;
  }
  .synergy-bar {
    height: 19px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 3px; font-size: 9.5px; font-weight: 900;
  }
  .syn-list { display: flex; gap: 4px; }
  .syn-pill {
    padding: 1px 6px; border-radius: 99px;
    background: #050811; border: 1px solid #334155; color: #64748b;
  }
  .syn-pill.on-f { border-color: #f97316; color: #fed7aa; background: rgba(249,115,22,0.25); }
  .syn-pill.on-i { border-color: #38bdf8; color: #bae6fd; background: rgba(56,189,248,0.25); }
  .syn-pill.on-b { border-color: #eab308; color: #fef08a; background: rgba(234,179,8,0.25); }
  .syn-pill.on-all {
    border-color: #fde047; color: #04060d;
    background: linear-gradient(90deg, #fde047, #38bdf8, #f472b6);
    box-shadow: 0 0 12px rgba(253,224,71,0.85);
  }

  .hero-grid {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
  }
  .hero-card {
    position: relative; width: 100%; height: 100%; min-height: 0;
    border-radius: 11px;
    background: #060913;
    border: 1.5px dashed #334155;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 3px; cursor: pointer; overflow: hidden;
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .hero-card:active { transform: scale(0.92); }
  .hero-card.occupied {
    border-style: solid; border-width: 2px; border-bottom-width: 3.5px;
    box-shadow: 0 5px 14px rgba(0,0,0,0.75);
  }
  /* Distinct Visual Frame Progression from Humble Lv.1 to GOD Lv.7 */
  .hero-card.r-1 { border-color: #64748b; }
  .hero-card.r-2 { border-color: #10b981; box-shadow: 0 0 10px rgba(16,185,129,0.35); }
  .hero-card.r-3 { border-color: #38bdf8; box-shadow: 0 0 14px rgba(56,189,248,0.55); }
  .hero-card.r-4 { border-color: #c084fc; box-shadow: 0 0 18px rgba(192,132,252,0.7); }
  .hero-card.r-5 { border-color: #fbbf24; box-shadow: 0 0 22px rgba(251,191,36,0.85); }
  .hero-card.r-6 { border-color: #f43f5e; box-shadow: 0 0 25px rgba(244,63,94,0.9); }
  .hero-card.r-7 {
    border-color: #fde047;
    box-shadow: 0 0 28px rgba(253,224,71,1), inset 0 0 16px rgba(253,224,71,0.65);
  }

  /* Full-Bleed Illustrated Character Portrait inside Card */
  .card-art-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center 20%;
    z-index: 1;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .hero-card.attacking .card-art-bg {
    transform: scale(1.22);
    filter: brightness(1.4) contrast(1.15);
  }

  /* Holographic Foil Shimmer Sweep for Lv.3+ */
  .holo-sheen {
    position: absolute; inset: -50%;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.42) 50%, transparent 65%);
    transform: translateX(-100%) rotate(15deg);
    animation: holoSweep 2.4s infinite;
    pointer-events: none; z-index: 2;
  }
  @keyframes holoSweep {
    0%   { transform: translateX(-90%) rotate(15deg); }
    45%  { transform: translateX(90%) rotate(15deg); }
    100% { transform: translateX(90%) rotate(15deg); }
  }

  /* Rotating Sacred Geometry Aura Ring on High-Level Cards (Lv.4+) */
  .aura-ring-svg {
    position: absolute; width: 92%; height: 92%; top: 4%; left: 4%;
    pointer-events: none; z-index: 2; opacity: 0.8;
    animation: spinSlow 5.5s linear infinite;
  }
  @keyframes spinSlow {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .hero-card.merge-ready {
    border-color: #fde047 !important;
    box-shadow: 0 0 18px rgba(253, 224, 71, 0.95), inset 0 0 14px rgba(253, 224, 71, 0.45) !important;
    animation: readyBounce 0.68s infinite alternate;
  }
  @keyframes readyBounce {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(-2.5px) scale(1.035); }
  }
  .hero-card.pop-anim {
    animation: cardAwaken 0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cardAwaken {
    0%   { transform: scale(0.38) rotate(-6deg); filter: brightness(3); }
    65%  { transform: scale(1.2) rotate(2deg); }
    100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
  }

  .card-hdr {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    z-index: 4; line-height: 1;
  }
  .r-tag {
    font-size: 8px; font-weight: 900; padding: 2px 4.5px;
    border-radius: 4px; background: rgba(3, 5, 12, 0.9);
    border: 1px solid rgba(255,255,255,0.4);
    text-shadow: 0 1px 3px #000;
  }
  .m-tag {
    font-size: 7.5px; font-weight: 900; padding: 2px 4.5px;
    border-radius: 4px; background: linear-gradient(135deg, #fde047, #f97316);
    color: #04060d; box-shadow: 0 0 10px #fde047;
  }
  .stage-dots {
    display: flex; gap: 2px; background: rgba(3,5,12,0.82);
    padding: 2px 4px; border-radius: 99px;
  }
  .s-dot {
    width: 4.5px; height: 4.5px; border-radius: 50%;
    background: #334155;
  }
  .s-dot.on { background: #fde047; box-shadow: 0 0 4px #fde047; }

  .card-ftr {
    width: 100%; text-align: center; z-index: 4;
    background: linear-gradient(180deg, rgba(3,5,12,0.55) 0%, rgba(3,5,12,0.95) 100%);
    border-radius: 6px; padding: 2px 2px 1.5px 2px; line-height: 1.15;
    border-top: 1px solid rgba(255,255,255,0.18);
  }
  .c-nm { font-size: 8.5px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px #000; }
  .c-pw { font-size: 7.5px; color: #f8fafc; font-weight: 900; }

  .empty-ui {
    margin: auto; display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: #475569; font-size: 9px; font-weight: 900;
  }
  .empty-ui span {
    width: 24px; height: 24px; border-radius: 50%; border: 1.5px dashed #475569;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }

  /* 4. Bottom Action Dock (60px) */
  footer.action-dock {
    height: 60px; flex-shrink: 0;
    display: grid; grid-template-columns: 1.25fr 1.25fr 1.15fr 0.85fr; gap: 6px;
    z-index: 10;
  }
  .t-btn {
    border: none; border-radius: 13px; padding: 4px 6px;
    cursor: pointer; color: #fff; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), 0 5px 14px rgba(0,0,0,0.65);
    transition: transform 0.08s, opacity 0.15s;
  }
  .t-btn:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 1px !important; }
  .t-btn:disabled { opacity: 0.4; filter: grayscale(0.4); cursor: not-allowed; }
  .t-btn .m-t { font-size: 12px; font-weight: 900; white-space: nowrap; }
  .t-btn .s-t { font-size: 9px; font-weight: 800; opacity: 0.92; white-space: nowrap; }

  .b-sum { background: linear-gradient(180deg, #38bdf8 0%, #0284c7 45%, #1d4ed8 100%); border: 1px solid #bae6fd; border-bottom: 4px solid #1e3a8a; }
  .b-mrg { background: linear-gradient(180deg, #fde047 0%, #f59e0b 50%, #d97706 100%); color: #04060d; border: 1px solid #fef9c3; border-bottom: 4px solid #78350f; }
  .b-mrg.glow { animation: btnPulse 0.7s infinite alternate; box-shadow: 0 0 22px rgba(253,224,71,0.9); }
  .b-ult { background: linear-gradient(180deg, #f472b6 0%, #9333ea 50%, #581c87 100%); border: 1px solid #fbcfe8; border-bottom: 4px solid #3b0764; }
  .b-ult.glow { animation: btnPulse 0.65s infinite alternate; box-shadow: 0 0 24px rgba(244,114,182,0.95); }
  .b-rsh { background: linear-gradient(180deg, #fb7185 0%, #e11d48 50%, #881337 100%); border: 1px solid #fecdd3; border-bottom: 4px solid #4c0519; }
  @keyframes btnPulse { from { transform: scale(1); } to { transform: scale(1.035); } }

  /* Modals */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(2, 4, 10, 0.88);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 12px;
  }
  .modal-backdrop.hidden { display: none; }
  .modal-sheet {
    background: linear-gradient(180deg, #1e293b 0%, #090d18 100%);
    border: 2px solid #fde047; border-radius: 18px;
    padding: 14px; max-width: 470px; width: 100%; max-height: 88dvh;
    overflow-y: auto; text-align: center;
    box-shadow: 0 0 50px rgba(0,0,0,0.95);
  }
  .up-list { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
  .up-item {
    background: linear-gradient(90deg, #060913, #1e293b);
    border: 1.5px solid #475569; border-radius: 12px; padding: 10px 12px;
    display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;
  }
  .up-item:active { transform: scale(0.97); border-color: #fde047; }
  .dex-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 5px; }
  .dex-cell {
    background: #060913; border: 1px solid #334155; border-radius: 8px;
    padding: 4px 2px; font-size: 8px; position: relative; overflow: hidden; text-align: center;
  }
  .dex-cell.unl { border-color: #fde047; box-shadow: 0 0 10px rgba(253,224,71,0.3); }
  .dex-cell img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; display: block; margin: 3px auto; }
</style>
</head>
<body>
<div class="game-frame" id="gameFrame">
  <div id="screenFlash"></div>
  <canvas id="fxCanvas"></canvas>

  <!-- 1. Top HUD -->
  <header class="hud-bar">
    <div style="display:flex;align-items:center;gap:5px">
      <span class="wave-tag" id="waveVal">WAVE 1</span>
      <div class="hp-pill">
        <span style="font-size:11px">🏰</span>
        <div class="hp-track"><div class="hp-fill" id="castleHpFill" style="width:100%"></div></div>
        <span class="hp-txt" id="castleHpText">100</span>
      </div>
    </div>
    <div class="res-group">
      <div class="res-box gold"><span>🪙</span><span id="goldVal">30G</span></div>
      <div class="res-box"><span>🏆</span><span id="scoreVal">0</span></div>
    </div>
    <div class="util-group">
      <button class="u-btn" id="btnDex">📖進化図鑑</button>
      <button class="u-btn" id="btnSpeed">⏩1x</button>
      <button class="u-btn" id="btnSound">🔊</button>
    </div>
  </header>

  <!-- 2. Illustrated Dark-Fantasy Battle Stage -->
  <div class="battle-viewport" id="battleViewport">
    <canvas id="battleCanvas"></canvas>
    <div class="stage-hud">
      <div class="coach-bar">
        <span class="coach-tag" id="coachBadge">✨進化合体</span>
        <span class="coach-msg" id="coachText">最初は可愛い幼体(Lv.1)！合体で騎士➔覇王➔神話神へ5段階進化！</span>
      </div>
      <div class="mob-counter" id="waveEnemyCount">💀 残7</div>
    </div>
    <div class="slash-cutin" id="cutinBanner">
      <div class="cutin-evo-pair" id="cutinEvoWrap">
        <img class="cutin-prev" id="cutinPrevImg" src="" alt="Before">
        <span class="cutin-arrow" id="cutinArrow">➔</span>
        <img class="cutin-portrait" id="cutinImg" src="" alt="After">
      </div>
      <div class="cutin-info">
        <span class="cutin-sub" id="cutinSub">EVOLUTION // 形態進化</span>
        <span class="cutin-txt" id="cutinText">⚡ 新たな姿へ進化覚醒！！</span>
      </div>
    </div>
  </div>

  <!-- 3. 4x3 Evolution Hero Summon Board -->
  <div class="board-wrap">
    <div class="synergy-bar">
      <div class="syn-list">
        <span class="syn-pill" id="synFire">🔥紅蓮系</span>
        <span class="syn-pill" id="synIce">❄️蒼氷系</span>
        <span class="syn-pill" id="synBolt">⚡紫電系</span>
        <span class="syn-pill" id="synTri">🌈三属性共鳴(全火力+35%)</span>
      </div>
      <span style="color:#fde047">🌟飛び級進化 <span id="luckyPctTxt">24%</span></span>
    </div>
    <div class="hero-grid" id="gridBoard"></div>
  </div>

  <!-- 4. Bottom Action Dock -->
  <footer class="action-dock">
    <button class="t-btn b-sum" id="btnSummon">
      <span class="m-t">➕ 召喚 (<span id="summonCostText">10</span>G)</span>
      <span class="s-t">Lv.1幼体を召喚</span>
    </button>
    <button class="t-btn b-mrg glow" id="btnAutoMerge">
      <span class="m-t" id="mergeBtnTitle">✨ 進化合体 (1組OK)</span>
      <span class="s-t">イラスト進化＋全体攻撃</span>
    </button>
    <button class="t-btn b-ult" id="btnUlt" disabled>
      <span class="m-t" id="ultBtnTitle">🌟 奥義 (50%)</span>
      <span class="s-t">終焉天罰レーザー</span>

  function buildStageDotsHtml(lv) {

    for (let s = 1; s <= 5; s++) {

  class Sfx {
    constructor() { this.on = true; this.ctx = null; }
    tone(freq, endFreq, dur = 0.12, type = 'sine', vol = 0.12) {
      if (!this.on) return;
      try {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, now);
        o.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
        g.gain.setValueAtTime(vol, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(now); o.stop(now + dur + 0.01);
      } catch (e) {}
    }
    summon() { this.tone(520, 820, 0.1, 'sine', 0.11); }
    merge(lv) {
      this.tone(180, 65, 0.2, 'sawtooth', 0.18);
      this.tone(340 * Math.pow(1.15, lv), 880 * Math.pow(1.15, lv), 0.28, 'triangle', 0.19);
    }
    ult() {
      this.tone(110, 38, 0.45, 'sawtooth', 0.24);
      [293, 369, 440, 587, 880].forEach((f, i) => setTimeout(() => this.tone(f, f * 1.5, 0.25, 'sawtooth', 0.16), i * 55));
    }
    shoot(lv) { this.tone(680 + lv * 45, 240, 0.045, lv >= 3 ? 'sawtooth' : 'sine', 0.03); }
    hitCastle() { this.tone(110, 42, 0.24, 'sawtooth', 0.2); }
  }

  }

  function findMergePairs() {
    const pairs = [], partnerMap = new Map();
    for (let i = 0; i < board.length; i++) {
      const a = board[i];
      if (!a || a.lv >= 7 || partnerMap.has(i)) continue;
      for (let j = i + 1; j < board.length; j++) {
        const b = board[j];
        if (b && !partnerMap.has(j) && a.type === b.type && a.lv === b.lv) {
          pairs.push([i, j]);
          partnerMap.set(i, j);
          partnerMap.set(j, i);
          break;
        }
      }
    }
    return { pairs, partnerMap };
  }

  function checkSynergy() {
    const present = new Set();
    board.forEach(u => { if (u) present.add(u.type); });
    const hasF = present.has('fire'), hasI = present.has('ice'), hasB = present.has('bolt');
    triSynergyActive = hasF && hasI && hasB;

    document.getElementById('synFire').className = 'syn-pill' + (hasF ? ' on-f' : '');
    document.getElementById('synIce').className  = 'syn-pill' + (hasI ? ' on-i' : '');
    document.getElementById('synBolt').className = 'syn-pill' + (hasB ? ' on-b' : '');
    document.getElementById('synTri').className  = 'syn-pill' + (triSynergyActive ? ' on-all' : '');
  }

  function renderBoard(justMergedIdx = -1) {
    checkSynergy();
    const { pairs, partnerMap } = findMergePairs();
    gridBoard.innerHTML = '';
    const synMul = triSynergyActive ? 1.35 : 1.0;

    board.forEach((unit, idx) => {
      const slot = document.createElement('div');
      slot.className = 'hero-card';
      slot.id = `heroSlot_${idx}`;
      if (unit) {
        const hInfo = HERO_DATA[unit.type];
        const isReady = partnerMap.has(idx);
        slot.classList.add('occupied', `r-${unit.lv}`);
        if (isReady) slot.classList.add('merge-ready');
        if (idx === justMergedIdx) slot.classList.add('pop-anim');

        const stageIdx = getStageIdx(unit.lv);
        const artSrc = hInfo.arts[stageIdx];
        const dmg = Math.round(hInfo.baseDmg * Math.pow(2.25, unit.lv - 1) * globalDmgMul * synMul);
        const charName = hInfo.tiers[Math.min(unit.lv - 1, hInfo.tiers.length - 1)];
        const roleName = hInfo.roles[Math.min(unit.lv - 1, hInfo.roles.length - 1)];
        const rLabel = RARITY_LABELS[unit.lv - 1];
        const rColor = RARITY_COLORS[unit.lv - 1];

        slot.innerHTML = `
          <img class="card-art-bg" src="${artSrc}" alt="${charName}">
          ${unit.lv >= 3 ? '<div class="holo-sheen"></div>' : ''}
          ${buildAuraOverlaySvg(hInfo.color, unit.lv)}
          <div class="card-hdr">
            <span class="r-tag" style="border-color:${rColor};color:${rColor}">${rLabel}</span>
            ${isReady ? '<span class="m-tag">✨進化可</span>' : buildStageDotsHtml(unit.lv)}
          </div>
          <div class="card-ftr">
            <div class="c-nm" style="color:${hInfo.border}">${charName}</div>
            <div class="c-pw">⚔️${dmg} <span style="color:#fde047">${roleName}</span></div>
          </div>
        `;
        slot.addEventListener('click', () => {
          if (state !== 'PLAYING') return;
          if (partnerMap.has(idx)) executeMerge(partnerMap.get(idx), idx);
        });
      } else {
        slot.innerHTML = `<div class="empty-ui"><span>＋</span>召喚枠</div>`;
        slot.addEventListener('click', () => {
          if (gold >= summonCost) summonUnit(idx);
        });
      }
      gridBoard.appendChild(slot);
    });

    const emptyCount = board.filter(x => !x).length;
    const btnSummon = document.getElementById('btnSummon');
    btnSummon.disabled = gold < summonCost || emptyCount === 0;
    document.getElementById('summonCostText').textContent = summonCost;
    document.getElementById('luckyPctTxt').textContent = `${Math.round(luckyChance * 100)}%`;

    const btnMerge = document.getElementById('btnAutoMerge');
    if (pairs.length > 0) {
      btnMerge.disabled = false;
      btnMerge.classList.add('glow');
      document.getElementById('mergeBtnTitle').textContent = `✨ 進化合体 (${pairs.length}組OK!)`;
    } else {
      btnMerge.disabled = true;
      btnMerge.classList.remove('glow');
      document.getElementById('mergeBtnTitle').textContent = '✨ 合体待ち';
    }

    updateTopHud(pairs.length, emptyCount);
  }

  function updateTopHud(pairCount = 0, emptyCount = 0) {
    document.getElementById('goldVal').textContent = `${gold}G`;
    document.getElementById('waveVal').textContent = `WAVE ${wave}`;
    document.getElementById('scoreVal').textContent = score.toLocaleString();
    if (score > bestScore) { bestScore = score; saveProgress(); }

    const hpPct = Math.max(0, Math.min(100, (castleHp / castleMaxHp) * 100));
    document.getElementById('castleHpFill').style.width = `${hpPct}%`;
    document.getElementById('castleHpText').textContent = Math.ceil(castleHp);
    document.getElementById('waveEnemyCount').textContent = `💀 残${enemies.length + waveQueue}`;

    const btnUlt = document.getElementById('btnUlt');
    const uPct = Math.min(100, Math.floor(ultGauge));
    if (uPct >= 100) {
      btnUlt.disabled = false;
      btnUlt.classList.add('glow');
      document.getElementById('ultBtnTitle').textContent = '🌟 奥義発動！';
    } else {
      btnUlt.disabled = true;
      btnUlt.classList.remove('glow');
      document.getElementById('ultBtnTitle').textContent = `🌟 奥義 (${uPct}%)`;
    }

    const cBadge = document.getElementById('coachBadge');
    const cText = document.getElementById('coachText');
    if (uPct >= 100) {
      cBadge.textContent = '🌟奥義発動可';
      cText.textContent = '紫の「🌟奥義発動！」で極大レーザー＆天罰剣雨！';
    } else if (pairCount > 0) {
      cBadge.textContent = '✨進化チャンス';
      cText.textContent = '光るカードを1タップするか下の「✨進化合体」で次の形態へ進化！';
    } else if (gold >= summonCost && emptyCount > 0) {
      cBadge.textContent = '➕召喚可能';
      cText.textContent = `左下の「➕召喚 (${summonCost}G)」でLv.1幼体を召喚して合体進化させよう！`;
    } else {
      cBadge.textContent = `⚔️WAVE ${wave}`;
      cText.textContent = triSynergyActive ? '🌈三属性共鳴発動中！全キャラの攻撃力+35%！' : '合体するたびに「幼体➔見習い➔騎士➔覇王➔神話神」へイラスト進化！';
    }
  }

  function getSlotCenter(idx) {
    const el = document.getElementById(`heroSlot_${idx}`);
    const fRect = gameFrame.getBoundingClientRect();
    if (!el) return { x: fw * 0.5, y: fh * 0.7 };
    const r = el.getBoundingClientRect();
    return { x: r.left - fRect.left + r.width * 0.5, y: r.top - fRect.top + r.height * 0.45 };
  }

  // Shows Before -> After portraits when evolving, or single portrait for Ultimate
  function triggerEvolutionCutin(type, prevLv, nextLv, subStr, mainStr) {
    const banner = document.getElementById('cutinBanner');
    const prevImg = document.getElementById('cutinPrevImg');
    const arrow = document.getElementById('cutinArrow');
    const afterImg = document.getElementById('cutinImg');
    const hInfo = HERO_DATA[type];

    if (prevLv && prevLv !== nextLv) {
      prevImg.style.display = 'block';
      arrow.style.display = 'inline';
      prevImg.src = hInfo.arts[getStageIdx(prevLv)];
      afterImg.src = hInfo.arts[getStageIdx(nextLv)];
    } else {
      prevImg.style.display = 'none';
      arrow.style.display = 'none';
      afterImg.src = hInfo.arts[4];
    }

    document.getElementById('cutinSub').textContent = subStr;
    document.getElementById('cutinText').textContent = mainStr;
    banner.classList.add('active');
    setTimeout(() => banner.classList.remove('active'), 1550);
  }

  function addParticles(x, y, color, count = 18, speedMul = 1.0) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = (55 + Math.random() * 155) * speedMul;
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        r: 2.5 + Math.random() * 4.5,
        color, life: 0.48, maxLife: 0.48
      });
    }
  }

  function addFloatText(x, y, text, color = '#fff', size = 14) {
    floatTexts.push({ x, y, text, color, size, life: 0.85, maxLife: 0.85 });
  }

  function executeMerge(idxFrom, idxTo) {
    const uA = board[idxFrom], uB = board[idxTo];
    if (!uA || !uB) return;

    const posFrom = getSlotCenter(idxFrom);
    const posTo   = getSlotCenter(idxTo);

    const prevLv = uA.lv;
    const isLucky = uA.lv <= 5 && Math.random() < luckyChance;
    const nextLv = Math.min(7, uA.lv + (isLucky ? 2 : 1));
    const type = uA.type;

    board[idxTo] = { type, lv: nextLv, cooldown: 0.06 };
    board[idxFrom] = null;

    for (let l = prevLv; l <= nextLv; l++) {
      if (!unlockedDex[type].includes(l)) unlockedDex[type].push(l);
    }
    saveProgress();

    sfx.merge(nextLv);
    score += nextLv * (isLucky ? 380 : 185);
    ultGauge = Math.min(100, ultGauge + 30);
    shakeMag = isLucky ? 16 : (nextLv >= 4 ? 12 : 7);

    const hInfo = HERO_DATA[type];
    const prevName = hInfo.tiers[prevLv - 1];
    const newName = hInfo.tiers[nextLv - 1];
    const stageIdx = getStageIdx(nextLv);

    flashScreen(hInfo.color, isLucky ? 0.52 : 0.32);
    lightningArcs.push({ x1: posFrom.x, y1: posFrom.y, x2: posTo.x, y2: posTo.y, color: '#fde047', life: 0.3 });
    shockRings.push({ x: posTo.x, y: posTo.y, r: 8, maxR: 110 + nextLv * 12, color: hInfo.color, life: 0.38, maxLife: 0.38 });
    addParticles(posTo.x, posTo.y, hInfo.color, 22 + nextLv * 4, 1.4);

    if (isLucky) {
      triggerEvolutionCutin(
        type, prevLv, nextLv,
        `🌟 2段階飛び級進化！ Lv.${prevLv} ➔ Lv.${nextLv} [${RARITY_LABELS[nextLv-1]}]`,
        `『${newName}』へ一気に超覚醒！！`
      );
    } else {
      triggerEvolutionCutin(
        type, prevLv, nextLv,
        `✨ 第${stageIdx + 1}形態へ進化！ Lv.${prevLv} ➔ Lv.${nextLv}『${newName}』`,
        hInfo.voices[stageIdx]
      );
    }

    const blast = Math.round(mergeBlastDmg * nextLv * globalDmgMul);
    slashWaves.push({ x: 55, y: viewportOffsetY + bh * 0.56, vx: 820, color: hInfo.color, life: 0.55 });
    addFloatText(bw * 0.5, viewportOffsetY + bh * 0.34, `✨進化衝撃波『${newName}』 -${blast}!!`, '#fde047', 15);

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.hp -= blast;
      e.hitFlash = 0.22;
      if (nextLv >= 3) {
        pillars.push({ x: e.x, y: viewportOffsetY + e.y, w: 28 + nextLv * 4, h: 110 + nextLv * 12, color: hInfo.color, life: 0.35, maxLife: 0.35 });
      }
      addParticles(e.x, viewportOffsetY + e.y, hInfo.color, 14, 1.3);
      if (e.hp <= 0) killEnemy(i);
    }
    renderBoard(idxTo);
  }

  function summonUnit(preferredIdx = null) {
    if (state !== 'PLAYING' || gold < summonCost) return;
    const emptyIndices = [];
    board.forEach((u, i) => { if (!u) emptyIndices.push(i); });
    if (emptyIndices.length === 0) return;

    gold -= summonCost;
    summonCost = Math.min(45, summonCost + 2);
    const targetIdx = (preferredIdx !== null && !board[preferredIdx])
      ? preferredIdx
      : emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
    const rType = TYPE_KEYS[Math.floor(Math.random() * TYPE_KEYS.length)];

    board[targetIdx] = { type: rType, lv: 1, cooldown: 0.1 };
    sfx.summon();
    renderBoard(targetIdx);
    const pos = getSlotCenter(targetIdx);
    shockRings.push({ x: pos.x, y: pos.y, r: 5, maxR: 58, color: HERO_DATA[rType].color, life: 0.24, maxLife: 0.24 });
    addParticles(pos.x, pos.y, HERO_DATA[rType].color, 12, 1.0);
  }

  function castUltimateSkill() {
    if (state !== 'PLAYING' || ultGauge < 100) return;
    ultGauge = 0;
    sfx.ult();
    shakeMag = 20;
    flashScreen('#fde047', 0.6);
    triggerEvolutionCutin('fire', null, 5, 'MYTHIC ULTIMATE // 三神終焉奥義', '🌟 天罰剣雨・ラグナロクレーザー！！');

    for (let i = 0; i < 11; i++) {
      setTimeout(() => {
        const px = 60 + Math.random() * (bw - 95);
        const py = viewportOffsetY + bh * 0.58;
        const col = ['#f97316', '#38bdf8', '#fde047', '#f43f5e'][i % 4];
        pillars.push({ x: px, y: py, w: 50, h: 175, color: col, life: 0.4, maxLife: 0.4 });
        shockRings.push({ x: px, y: py, r: 8, maxR: 105, color: col, life: 0.34, maxLife: 0.34 });
        addParticles(px, py, col, 26, 1.6);
        const uDmg = Math.round(135 * globalDmgMul * (1 + wave * 0.3));
        addFloatText(px, py - 24, `⚡天罰 -${uDmg}!!`, '#fde047', 16);
        for (let j = enemies.length - 1; j >= 0; j--) {
          if (Math.abs(enemies[j].x - px) < 115) {
            enemies[j].hp -= uDmg;
            enemies[j].hitFlash = 0.22;
            if (enemies[j].hp <= 0) killEnemy(j);
          }
        }
      }, i * 60);
    }
    renderBoard();
  }

  function startWave(w) {
    wave = w;
    waveQueue = 5 + w * 2;
    spawnTimer = 0.2;
    renderBoard();
  }

  function spawnEnemyFromQueue() {
    const isBoss = waveQueue === 1 && wave % 2 === 0;
    const baseHp = isBoss ? (250 + wave * 135) : (36 + wave * 26);
    const speed = isBoss ? 26 : (38 + Math.min(32, wave * 2.5));

    enemies.push({
      x: bw - 42,
      y: bh * 0.62 + (Math.random() - 0.5) * 14,
      hp: baseHp, maxHp: baseHp, speed, isBoss,
      glowColor: isBoss ? '#fde047' : '#38bdf8',
      size: isBoss ? 58 : 40,
      slowTimer: 0, hitFlash: 0, walkPhase: Math.random() * 6,
      goldReward: isBoss ? 48 : 10
    });
  }

  function killEnemy(idx) {
    const e = enemies[idx];
    if (!e) return;
    const ex = e.x, ey = viewportOffsetY + e.y;
    enemies.splice(idx, 1);
    gold += e.goldReward;
    ultGauge = Math.min(100, ultGauge + (e.isBoss ? 36 : 9));
    score += e.isBoss ? 800 : 120;
    shockRings.push({ x: ex, y: ey, r: 6, maxR: e.isBoss ? 120 : 60, color: e.glowColor, life: 0.3, maxLife: 0.3 });
    addParticles(ex, ey, e.glowColor, e.isBoss ? 32 : 16, 1.4);
    addFloatText(ex, ey - 18, `+${e.goldReward}G`, '#fde047', 13);
    renderBoard();

    if (enemies.length === 0 && waveQueue <= 0 && state === 'PLAYING') {
      openUpgradeModal();
    }
  }

  const UPGRADES = [
    { icon: '⚔️', title: '紅蓮覇王の刻印', desc: '全キャラの攻撃力 +35% 永続UP', apply: () => { globalDmgMul *= 1.35; } },
    { icon: '⚡', title: '神速抜刀の境地', desc: '全キャラの攻撃速度 +28% 永続UP', apply: () => { globalSpdMul *= 1.28; } },
    { icon: '💰', title: '黄金郷の軍資金', desc: '即時 +55G 獲得 ＆ 召喚コスト -4G', apply: () => { gold += 55; summonCost = Math.max(10, summonCost - 4); } },
    { icon: '🌟', title: '神引き飛び級＆奥義充填', desc: '2段階飛び級進化率+12% ＆ 奥義ゲージ100%満タン', apply: () => { luckyChance = Math.min(0.60, luckyChance + 0.12); ultGauge = 100; } }
  ];

  function openUpgradeModal() {
    state = 'UPGRADE';
    const modal = document.getElementById('upgradeModal');
    document.getElementById('upgradeModalTitle').textContent = `🎉 WAVE ${wave} 殲滅完了！3択覚醒`;
    const grid = document.getElementById('upgradeGrid');
    grid.innerHTML = '';
    [...UPGRADES].sort(() => Math.random() - 0.5).slice(0, 3).forEach(c => {
      const item = document.createElement('div');
      item.className = 'up-item';
      item.innerHTML = `
        <div style="font-size:28px">${c.icon}</div>
        <div>
          <div style="font-size:13.5px;font-weight:900;color:#fde047">${c.title}</div>
          <div style="font-size:11px;color:#e2e8f0">${c.desc}</div>
        </div>
      `;
      item.addEventListener('click', () => {
        c.apply();
        modal.classList.add('hidden');
        state = 'PLAYING';
        startWave(wave + 1);
      });
      grid.appendChild(item);
    });
    modal.classList.remove('hidden');
  }

  function update(rawDt) {
    animTime += rawDt;
    if (shakeMag > 0) shakeMag = Math.max(0, shakeMag - rawDt * 28);
    if (state !== 'PLAYING') return;
    const dt = rawDt * gameSpeed;

    if (waveQueue > 0) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnTimer = Math.max(0.65, 1.45 - wave * 0.06);
        waveQueue -= 1;
        spawnEnemyFromQueue();
        const { pairs } = findMergePairs();
        updateTopHud(pairs.length, board.filter(x => !x).length);
      }
    }

    if (enemies.length > 0) {
      const synMul = triSynergyActive ? 1.35 : 1.0;
      board.forEach((u, idx) => {
        if (!u) return;
        const hInfo = HERO_DATA[u.type];
        u.cooldown -= dt * globalSpdMul * (1 + (u.lv - 1) * 0.14);
        if (u.cooldown <= 0) {
          u.cooldown = hInfo.fireRate;
          let target = enemies[0];
          for (let e of enemies) if (e.x < target.x) target = e;

          const startPos = getSlotCenter(idx);
          const dmg = Math.round(hInfo.baseDmg * Math.pow(2.25, u.lv - 1) * globalDmgMul * synMul);

          fxProjectiles.push({
            x: startPos.x, y: startPos.y,
            prevX: startPos.x, prevY: startPos.y,
            target,
            type: u.type, lv: u.lv,
            dmg,
            color: hInfo.projColor,
            speed: 580 + u.lv * 55
          });
          sfx.shoot(u.lv);

          const cardEl = document.getElementById(`heroSlot_${idx}`);
          if (cardEl) {
            cardEl.classList.add('attacking');
            setTimeout(() => cardEl.classList.remove('attacking'), 110);
          }
        }
      });
    }

    for (let i = fxProjectiles.length - 1; i >= 0; i--) {
      const p = fxProjectiles[i];
      if (!enemies.includes(p.target)) {
        if (enemies.length > 0) p.target = enemies[0];
        else { fxProjectiles.splice(i, 1); continue; }
      }
      p.prevX = p.x; p.prevY = p.y;
      const tx = p.target.x;
      const ty = viewportOffsetY + p.target.y;
      const dx = tx - p.x, dy = ty - p.y, dist = Math.hypot(dx, dy);

      if (dist < 24) {
        const t = p.target;
        const isCrit = Math.random() < (0.15 + p.lv * 0.04);
        const finalDmg = isCrit ? Math.round(p.dmg * 1.55) : p.dmg;
        t.hp -= finalDmg;
        t.hitFlash = 0.14;

        // Visual impact scales dramatically with evolution level!
        addParticles(tx, ty, p.color, 6 + p.lv * 3, 0.85 + p.lv * 0.12);
        shockRings.push({ x: tx, y: ty, r: 3, maxR: 18 + p.lv * 10, color: p.color, life: 0.22, maxLife: 0.22 });
        addFloatText(tx + (Math.random() - 0.5) * 16, ty - 20, isCrit ? `💥${finalDmg}!` : `-${finalDmg}`, isCrit ? '#fde047' : p.color, isCrit ? 15 : 12);

        if (p.type === 'fire' && p.lv >= 3) {
          pillars.push({ x: tx, y: ty, w: 16 + p.lv * 5, h: 60 + p.lv * 14, color: '#f97316', life: 0.26, maxLife: 0.26 });
        } else if (p.type === 'ice') {
          t.slowTimer = 1.6 + p.lv * 0.4;
          if (p.lv >= 4) {
            pillars.push({ x: tx, y: ty, w: 18 + p.lv * 4, h: 65 + p.lv * 12, color: '#38bdf8', life: 0.24, maxLife: 0.24 });
          }
        } else if (p.type === 'bolt' && p.lv >= 2) {
          let chCnt = 0;
          const maxChains = Math.min(3, p.lv - 1);
          for (let j = enemies.length - 1; j >= 0; j--) {
            const o = enemies[j];
            if (o !== t && Math.abs(o.x - t.x) < 115 && chCnt < maxChains) {
              chCnt++;
              const cd = Math.round(finalDmg * 0.7);
              o.hp -= cd; o.hitFlash = 0.12;
              lightningArcs.push({ x1: tx, y1: ty, x2: o.x, y2: viewportOffsetY + o.y, color: '#fef08a', life: 0.16 });
              if (o.hp <= 0) killEnemy(j);
            }
          }
        }
        const tIdx = enemies.indexOf(t);
        if (tIdx !== -1 && t.hp <= 0) killEnemy(tIdx);
        fxProjectiles.splice(i, 1);
      } else {
        p.x += (dx / dist) * p.speed * dt;
        p.y += (dy / dist) * p.speed * dt;
      }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.walkPhase += dt * 8;
      if (e.hitFlash > 0) e.hitFlash -= rawDt;
      if (e.slowTimer > 0) e.slowTimer -= dt;
      e.x -= e.speed * (e.slowTimer > 0 ? 0.5 : 1.0) * dt;

      if (e.x <= 54) {
        const cDmg = e.isBoss ? 30 : 12;
        castleHp = Math.max(0, castleHp - cDmg);
        sfx.hitCastle();
        shakeMag = 12;
        flashScreen('#f43f5e', 0.35);
        addParticles(54, viewportOffsetY + e.y, '#f43f5e', 18, 1.3);
        addFloatText(74, viewportOffsetY + e.y - 12, `🏰-${cDmg}`, '#f43f5e', 15);
        enemies.splice(i, 1);
        renderBoard();

        if (castleHp <= 0) {
          state = 'GAMEOVER';
          document.getElementById('finalSummaryText').textContent = `到達WAVE: WAVE ${wave} ｜ スコア: ${score.toLocaleString()} pt`;
          document.getElementById('gameOverModal').classList.remove('hidden');
          return;
        } else if (enemies.length === 0 && waveQueue <= 0) {
          openUpgradeModal();
        }
      }
    }

    for (let i = slashWaves.length - 1; i >= 0; i--) {
      slashWaves[i].x += slashWaves[i].vx * rawDt;
      slashWaves[i].life -= rawDt;
      if (slashWaves[i].life <= 0) slashWaves.splice(i, 1);
    }
    for (let i = pillars.length - 1; i >= 0; i--) {
      pillars[i].life -= rawDt;
      if (pillars[i].life <= 0) pillars.splice(i, 1);
    }
    for (let i = shockRings.length - 1; i >= 0; i--) {
      const sr = shockRings[i];
      sr.life -= rawDt;
      sr.r = sr.maxR * (1 - sr.life / sr.maxLife);
      if (sr.life <= 0) shockRings.splice(i, 1);
    }
    for (let i = lightningArcs.length - 1; i >= 0; i--) {
      lightningArcs[i].life -= rawDt;
      if (lightningArcs[i].life <= 0) lightningArcs.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i]; pt.life -= rawDt;
      pt.x += pt.vx * rawDt; pt.y += pt.vy * rawDt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      if (pt.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const ft = floatTexts[i]; ft.life -= rawDt; ft.y -= 26 * rawDt;
      if (ft.life <= 0) floatTexts.splice(i, 1);
    }
  }

  function drawEnemyToken(ctx, e) {
    ctx.save();
    const bounce = Math.abs(Math.sin(e.walkPhase)) * 4.5;
    const cx = e.x, cy = e.y - bounce;
    const r = e.size * 0.5;

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.ellipse(cx, e.y + r * 0.75, r * 0.85, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();

    const img = e.isBoss ? bossImg : mobImg;
    if (img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, cx - r, cy - r, r * 2, r * 2);
    } else {
      ctx.fillStyle = '#881337';
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }

    if (e.hitFlash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    } else if (e.slowTimer > 0) {
      ctx.fillStyle = 'rgba(56,189,248,0.45)';
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
    ctx.restore();

    ctx.strokeStyle = e.isBoss ? '#fde047' : (e.slowTimer > 0 ? '#38bdf8' : '#f43f5e');
    ctx.lineWidth = e.isBoss ? 3 : 2;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = e.isBoss ? 14 : 8;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    const w = e.isBoss ? 54 : 36, h = 5.5;
    const bx = cx - w / 2, by = cy - r - 9;
    ctx.fillStyle = '#03050a';
    ctx.fillRect(bx - 1, by - 1, w + 2, h + 2);
    ctx.fillStyle = e.isBoss ? '#fde047' : '#f43f5e';
    ctx.fillRect(bx, by, w * Math.max(0, e.hp / e.maxHp), h);
    ctx.restore();
  }

  function drawAll() {
    bCtx.save();
    bCtx.clearRect(0, 0, bw, bh);
    if (shakeMag > 0.2) bCtx.translate((Math.random() - 0.5) * shakeMag, (Math.random() - 0.5) * shakeMag);

    if (bgImg.complete && bgImg.naturalWidth > 0) {
      bCtx.drawImage(bgImg, 0, 0, bw, bh);
    } else {
      bCtx.fillStyle = '#090d1a';
      bCtx.fillRect(0, 0, bw, bh);
    }

    enemies.forEach(e => drawEnemyToken(bCtx, e));
    bCtx.restore();

    fCtx.clearRect(0, 0, fw, fh);
    fCtx.save();
    fCtx.globalCompositeOperation = 'lighter';

    pillars.forEach(pl => {
      const a = Math.max(0, pl.life / pl.maxLife);
      const grad = fCtx.createLinearGradient(pl.x, pl.y, pl.x, pl.y - pl.h);
      grad.addColorStop(0, pl.color);
      grad.addColorStop(1, 'transparent');
      fCtx.globalAlpha = a * 0.9;
      fCtx.fillStyle = grad;
      fCtx.fillRect(pl.x - pl.w * 0.5 * a, pl.y - pl.h, pl.w * a, pl.h);
    });

    shockRings.forEach(sr => {
      const a = Math.max(0, sr.life / sr.maxLife);
      fCtx.globalAlpha = a * 0.92;
      fCtx.strokeStyle = sr.color;
      fCtx.lineWidth = 4 * a;
      fCtx.beginPath();
      fCtx.arc(sr.x, sr.y, sr.r, 0, Math.PI * 2);
      fCtx.stroke();
    });

    slashWaves.forEach(sw => {
      const a = Math.max(0, sw.life / 0.55);
      fCtx.globalAlpha = a;
      fCtx.strokeStyle = sw.color;
      fCtx.lineWidth = 7;
      fCtx.shadowColor = sw.color;
      fCtx.shadowBlur = 18;
      fCtx.beginPath();
      fCtx.arc(sw.x, sw.y, 42, -Math.PI * 0.42, Math.PI * 0.42);
      fCtx.stroke();
      fCtx.shadowBlur = 0;
    });

    lightningArcs.forEach(arc => {
      fCtx.globalAlpha = 1;
      fCtx.strokeStyle = arc.color || '#fef08a';
      fCtx.lineWidth = 3.5;
      fCtx.shadowColor = arc.color || '#fde047';
      fCtx.shadowBlur = 16;
      fCtx.beginPath();
      fCtx.moveTo(arc.x1, arc.y1);
      fCtx.lineTo((arc.x1 + arc.x2) * 0.5 + (Math.random() - 0.5) * 24, (arc.y1 + arc.y2) * 0.5 + (Math.random() - 0.5) * 14);
      fCtx.lineTo(arc.x2, arc.y2);
      fCtx.stroke();
      fCtx.shadowBlur = 0;
    });

    fxProjectiles.forEach(p => {
      fCtx.globalAlpha = 0.82;
      fCtx.strokeStyle = p.color;
      fCtx.lineWidth = 2.5 + p.lv * 1.1;
      fCtx.lineCap = 'round';
      fCtx.beginPath();
      fCtx.moveTo(p.prevX, p.prevY);
      fCtx.lineTo(p.x, p.y);
      fCtx.stroke();

      fCtx.globalAlpha = 1;
      fCtx.fillStyle = '#ffffff';
      fCtx.shadowColor = p.color;
      fCtx.shadowBlur = 10 + p.lv * 2.5;
      fCtx.beginPath();
      fCtx.arc(p.x, p.y, 3.2 + p.lv * 1.15, 0, Math.PI * 2);
      fCtx.fill();
      fCtx.shadowBlur = 0;
    });

    particles.forEach(pt => {
      fCtx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      fCtx.fillStyle = pt.color;
      fCtx.beginPath();
      fCtx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      fCtx.fill();
    });
    fCtx.restore();

    floatTexts.forEach(ft => {
      fCtx.save();
      fCtx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
      fCtx.font = `900 italic ${ft.size}px sans-serif`;
      fCtx.textAlign = 'center';
      fCtx.strokeStyle = '#02040a';
      fCtx.lineWidth = 3.5;
      fCtx.strokeText(ft.text, ft.x, ft.y);
      fCtx.fillStyle = ft.color;
      fCtx.fillText(ft.text, ft.x, ft.y);
      fCtx.restore();
    });
  }

  document.getElementById('btnSummon').addEventListener('click', () => summonUnit());
  document.getElementById('btnAutoMerge').addEventListener('click', () => {
    if (state !== 'PLAYING') return;
    const { pairs } = findMergePairs();
    if (pairs.length > 0) executeMerge(pairs[0][0], pairs[0][1]);
  });
  document.getElementById('btnUlt').addEventListener('click', castUltimateSkill);
  document.getElementById('btnRushWave').addEventListener('click', () => {
    if (state !== 'PLAYING') return;
    gold += 25; wave += 1; waveQueue += 5 + wave;
    addFloatText(bw * 0.5, viewportOffsetY + bh * 0.45, '😈 強襲WAVE呼出 +25G!', '#fda4af', 15);
    renderBoard();
  });

  document.getElementById('btnDex').addEventListener('click', () => {
    state = 'DEX';
    const wrap = document.getElementById('dexContent');
    wrap.innerHTML = '';
    const stageTitles = ['第1形態(Lv.1)', '第2形態(Lv.2)', '第3形態(Lv.3)', '第4形態(Lv.4)', '最終神話(Lv.5+)'];
    TYPE_KEYS.forEach(tk => {
      const h = HERO_DATA[tk];
      const div = document.createElement('div');
      div.style.marginBottom = '10px';
      div.innerHTML = `<div style="font-size:11.5px;font-weight:900;color:${h.border}">${h.familyName}</div>`;
      const g = document.createElement('div');
      g.className = 'dex-grid';
      for (let s = 0; s < 5; s++) {
        const lv = s + 1;
        const unl = unlockedDex[tk] && unlockedDex[tk].some(uLv => getStageIdx(uLv) >= s);
        const c = document.createElement('div');
        c.className = 'dex-cell' + (unl ? ' unl' : '');
        c.innerHTML = `
          <div style="color:${RARITY_COLORS[lv-1]};font-weight:900">${stageTitles[s]}</div>
          <img src="${h.arts[s]}" alt="${h.tiers[s]}" style="${unl ? '' : 'filter:brightness(0.35) grayscale(0.7)'}">
          <div style="font-weight:800;color:#f8fafc">${h.tiers[s]}</div>
        `;
        g.appendChild(c);
      }
      div.appendChild(g);
      wrap.appendChild(div);
    });
    document.getElementById('dexModal').classList.remove('hidden');
  });
  document.getElementById('btnCloseDex').addEventListener('click', () => {
    document.getElementById('dexModal').classList.add('hidden');
    state = 'PLAYING';
  });

  document.getElementById('btnSpeed').addEventListener('click', e => {
    gameSpeed = gameSpeed === 1 ? 2 : 1;
    e.currentTarget.textContent = `⏩${gameSpeed}x`;
    e.currentTarget.classList.toggle('active', gameSpeed === 2);
  });
  document.getElementById('btnSound').addEventListener('click', e => {
    sfx.on = !sfx.on;
    e.currentTarget.textContent = sfx.on ? '🔊' : '🔇';
  });
  document.getElementById('btnRetry').addEventListener('click', () => {
    document.getElementById('gameOverModal').classList.add('hidden');
    gold = 30; summonCost = 10; score = 0; castleHp = 100; ultGauge = 50;
    globalDmgMul = 1.0; globalSpdMul = 1.0;
    board = new Array(12).fill(null);
    board[0] = { type: 'fire', lv: 1, cooldown: 0.2 };
    board[1] = { type: 'fire', lv: 1, cooldown: 0.4 };
    board[2] = { type: 'ice',  lv: 1, cooldown: 0.3 };
    board[5] = { type: 'bolt', lv: 1, cooldown: 0.3 };
    enemies = []; fxProjectiles = []; slashWaves = []; pillars = [];
    state = 'PLAYING';
    startWave(1);
  });
  document.getElementById('btnShareX').addEventListener('click', () => {
    const txt = encodeURIComponent(`【⚔️ ALCHEMERGE: RAGNAROK】\n🏰 到達: WAVE ${wave}｜🏆 スコア: ${score.toLocaleString()} pt\n幼体から神話神へ5段階進化×ド派手ディフェンス！\n#AlcheMerge #shinpoyo`);
    window.open(`https://x.com/intent/tweet?text=${txt}`, '_blank', 'noopener');
  });

  startWave(1);
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    drawAll();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
