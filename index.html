const WS_COST={2:40,3:100,4:240,5:560,6:1200}; // 工房レベルを上げる魔力
// ★t を錬成するには工房レベル t-1 が要る（序盤に上位元素ひとつで押し切れないように）
const rankLv=t=>t-1,rankOpen=t=>S.ws>=rankLv(t);
const canBuy=id=>{const d=ITEMS[id];return disc.has(id)&&(d.t===1||S.made.has(id)||d.t<=S.ws)};
// しぼりこみと並べ替え（⇅の窓で選ぶ）。rank・place・role は複数選べ、何も選んでいなければ全部を出す
// rank：1〜6、place：tower/trap、role：burn/slow/area/chain/pierce/buff
const FLT={rank:new Set(),place:new Set(),role:new Set(),sort:'rank',only:false};
const fltOn=()=>FLT.place.size>0||FLT.role.size>0||FLT.only; // ★以外で札をしぼっているか（並べ替えだけなら札は減らない）
const rankKey=()=>FLT.rank.size===1?[...FLT.rank][0]:0; // ★が 1 つだけなら、その★のタブとして扱う（横に流した位置を★ごとに覚える）
function setRank(a){FLT.rank=new Set(a);SHOP.tab=rankKey();SHOP.scroll[SHOP.tab]=0}
const ROLE={burn:d=>!!d.dot,slow:d=>!!(d.slow||d.stop||d.stun),area:d=>!!d.splash||d.kind==='pulse',chain:d=>d.kind==='chain',pierce:d=>d.kind==='pierce',buff:d=>d.kind==='support'};
const PLACE={tower:d=>d.kind!=='trap'&&d.kind!=='relic',trap:d=>d.kind==='trap'};
const fltOk=d=>(!FLT.place.size||[...FLT.place].some(k=>PLACE[k](d)))&&(!FLT.role.size||[...FLT.role].some(k=>ROLE[k](d)));
const power=d=>(d.dmg||0)*(d.rate||1)*(d.beams||1)+(d.dot||0);
function fltSort(a){
  if(FLT.sort==='cost')return a.sort((x,y)=>itemValue(x)-itemValue(y));
  if(FLT.sort==='pow')return a.sort((x,y)=>power(y)-power(x));
  if(FLT.sort==='new'){const m=[...S.made],r=id=>{const i=m.indexOf(id);return i<0?-1:i};return a.sort((x,y)=>r(y.id)-r(x.id))}
  return a.sort((x,y)=>x.t-y.t);
}
function shopList(t){
  // t：1〜6 はその★だけ、0 は窓で選んだ★（何も選んでいなければ全部）
  const rk=t?new Set([t]):FLT.rank,a=Object.values(ITEMS).filter(d=>(!rk.size||rk.has(d.t))&&fltOk(d)),f=fltOn(),nx=S.ws+1;
  const head=t>1&&S.ws<t?[{id:'__ws',ws:t}]:t===0&&nx<=6&&!f&&(!rk.size||rk.has(nx))?[{id:'__ws',ws:nx}]:[]; // まだ届いていない★のタブの先頭に、工房レベルを上げる札
  return head.concat(fltSort(a.filter(d=>canBuy(d.id))),FLT.only?[]:fltSort(a.filter(d=>disc.has(d.id)&&!canBuy(d.id))),f?[]:a.filter(d=>!disc.has(d.id))); // しぼっている間は、まだ見つけていない札は出さない
}
function wsHint(t,delay=0){ // 工房の札が初めて目に入ったとき、何をする札かを一言で知らせる（その戦いで 1 回）
  if(S.wsHinted||!(t>1&&S.ws<t))return;S.wsHinted=true;
  setTimeout(()=>floatText(W/2,SHOP.y-18,TT('wsInfo',S.ws+1),'#ffe9a0',FS.f1),delay*1000);
}

  floatText(W/2,SHOP.y-18,t<6?TT('wsUp2',t,t+1):TT('wsUp',t),'#ffe9a0',FS.f2);floatText(W-74,48,'−'+cost,'#ffb89a',FS.f2);SHOP.scroll[t]=0;
  if(!S.active)saveRun();

const shopMax=t=>Math.max(0,shopList(t).length*SHOP.pitch-5-SHOP.w);
const shopBtnX=i=>SHOP.x+i*SHOP.pitch-SHOP.scroll[SHOP.tab];
function shopShow(id){ // その元素のボタンが見える位置までタブと列を動かす

  if(i<0){t=ITEMS[id].t;i=shopList(t).findIndex(d=>d.id===id);if(i<0)return;setRank([t])} // 今の一覧に無ければ、その★へ切り替える（しぼりこみで見えない札は追わない）
  SHOP.tab=t;SHOP.scroll[t]=clamp(i*SHOP.pitch-(SHOP.w-SHOP.bw)/2,0,shopMax(t));SHOP.newId=id;SHOP.newT=5;wsHint(t,2.2);

// 鎧の影が防ぐ系統（元素の系統 FAMOF のうち、数の多い 9 つ）。色と、紋に使う元素の絵
const ELEM={flame:{c:'#ff6a3d',icon:'fire'},water:{c:'#4aa8ff',icon:'water'},earth:{c:'#c08a4a',icon:'earth'},wind:{c:'#7df0c0',icon:'wind'},volt:{c:'#ffe45c',icon:'bolt'},
  ice:{c:'#8fe6ff',icon:'ice'},poison:{c:'#8be04a',icon:'venom'},dark:{c:'#9a7ad8',icon:'dark'},light:{c:'#fff2a0',icon:'light'}};
const ARMOR_FAMS=Object.keys(ELEM);
const armorFam=w=>STAGES[STAGE].aff?STAGES[STAGE].aff.resist:ARMOR_FAMS[mixH(w*31+STAGE*7+5)%ARMOR_FAMS.length]; // ステージと波で決まる（同じ波をやり直せば同じ系統）
let HP0=80,HP_GROW=1.28,FINAL_M=2;
const waveHp=w=>HP0*HP_GROW**(w-1)*STAGES[STAGE].hp*DIFF[NIGHT].hp;
function buildWave(w){
  const q=[];let t=0;
  const add=(type,n,gap,m=1)=>{for(let i=0;i<n;i++){q.push({type,at:t,m});t+=gap}};
  const gap=Math.max(.38,.95-w*.028);
  if(w>=3&&w%3===0){add('mite',8+w,gap*.38);t+=1}
  const sp=(STAGES[STAGE].spice??1)*DIFF[NIGHT].spice; // くせのある敵の多さ（最初のステージは半分）
  // 癒す影（第 9 波から）と鎧の影（第 13 波から）は、数を足すのではなく、影・硬い影と入れかわる（敵の総数と魔力の入りはこれまでと同じ）
  const nHeal=w>=9?Math.ceil((1+Math.floor((w-9)/4))*sp):0,nArm=w>=13?Math.ceil((1+Math.floor((w-13)/3))*sp):0;
  add('shade',5+Math.floor(w*1.25)-nHeal,gap);
  if(w>=2)add('wisp',1+(w>>1),gap*.7);
  if(w>=4){const ng=Math.max(1,Math.floor(w/2.5)-nArm);
    for(let i=0;i<ng;i++){q.push({type:'golem',at:t,m:1});if(i<nHeal)q.push({type:'healer',at:t+gap*.8,m:1});t+=gap*1.6}} // 癒す影は、硬い影のあいだに混ざって出る
  if(nArm)add('armored',nArm,gap*1.6);
  if(w>=6)add('runner',Math.ceil((2+Math.floor((w-6)*.5))*sp),gap*.8);
  if(w>=8)add('flyer',Math.ceil((2+Math.floor((w-8)*.5))*sp),gap);
  if(w>=11)add('splitter',Math.ceil((1+Math.floor((w-11)/2))*sp),gap*1.7);
  if(w%5===0){t+=1;add('boss',1,1,w%20===0?FINAL_M:w===5?.75:1);if(w%20===0)q[q.length-1].final=true} // 20 波ごとの「夜の王」
  return q;
}

/* ---------------- 状態 ---------------- */
let S,UNDO=null,disc,madeR=new Set(),prog={},muted=false,musicOff=false,FX=true,bgCanvas=null,TUT=0,RUN=null; // TUT：手引きを終えたら 9
const SAVE='yoiyami-alchemy-v1';
// 途中保存として読めるものだけ受けつける。項目が欠けていたり型がちがうものは捨てる（「つづきから」で止まったり、波や灯が NaN になったりしないように）
const runOK=r=>!!r&&typeof r==='object'&&!!STAGES[r.stage]&&Array.isArray(r.items)&&[r.wave,r.mana,r.lives].every(v=>typeof v==='number'&&isFinite(v)&&v>=0)&&r.lives>0;
try{const d=JSON.parse(localStorage.getItem(SAVE)||'{}');disc=new Set((Array.isArray(d.disc)?d.disc:BASES).filter(i=>ITEMS[i])); // 前の仕組み（図鑑の数）ですでに開いた木・光・闇はそのまま残す
  if(Array.isArray(d.madeR))madeR=new Set(d.madeR.filter(k=>typeof k==='string'&&RECIPE[k])); // 実際に作った組み合わせ（rkey 形式）
  else if(Array.isArray(d.disc)){madeR=new Set();for(const k in RECIPE){const[a,b]=k.split('+');if(disc.has(a)&&disc.has(b))madeR.add(k)}} // madeR が無い古いセーブ（disc の記録があるもの）：材料が両方そろっているレシピを、作ったものとして引き継ぐ。初回・初期化直後は disc が無いので種まきしない
  prog=d.prog&&typeof d.prog==='object'&&!Array.isArray(d.prog)?d.prog:{};for(const k in prog){const v=prog[k];if(!v||typeof v!=='object')delete prog[k];else{v.best=Math.max(0,Math.floor(+v.best)||0);v.clear=!!v.clear}} // 形のおかしい記録は捨てる（そのままだと最高記録が更新されなくなる）
  TUT=d.tut?9:0;RUN=runOK(d.run)?d.run:null;if(d.best&&!prog['0'])prog['0']={best:d.best,clear:d.best>=20};
  for(const id in UNLOCK)if(!disc.has(id)&&(prog[String(UNLOCK[id])]||{}).clear)disc.add(id);muted=!!d.muted;musicOff=!!d.musicOff}catch(e){disc=new Set(BASES)}
BASES.forEach(b=>disc.add(b));
// 統計：これまでの合計。保存は項目を足すだけで、これまでの項目（disc・prog・run など）の意味と形は変えない

/* デイリーチャレンジ（今日の挑戦）：日付で決まるステージと難易度を 1 つ出し、退けた波の自己ベストを日付ごとに残す。
   ふつうのステージの進行度（prog）には書かない。保存は daily という項目を足すだけ */
let DAILY=null;   // 今日の挑戦として遊んでいる間は、その日付（'2026-11-16'）
const daily={};   // 日付 → {best:退けた波, clear, stage, night}
const DAILY_KEEP=120,DAILY_GOAL=10;
const dayKey=(t=new Date())=>`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
const mixH=h=>{h^=h>>>16;h=Math.imul(h,0x7feb352d);h^=h>>>15;h=Math.imul(h,0x846ca68b);h^=h>>>16;return h>>>0}; // 日付の並びが続いても散らばるよう混ぜる
function dailyOf(key){ // 3 日に 1 日ほどが悪夢。ステージは、前の日と同じものが続かないように決める
  // 日付を 7 日ごとの組に分ける。組の 1 日目は組の番号だけで決め、2 日目からは「前の日のステージから 1〜L-1 だけ進める」ので、前の日と同じにならない。
  // 組の最後の日は、前の日とも、次の組の 1 日目ともちがうステージから選ぶ（組の境目でも続かない）。
  // 前の日を「ずらす前の値」で見ていたころは、前の日もずれていたときに同じステージが続くことがあった
  const L=STAGES.length,B=7,h=x=>mixH(hsh('alchemerge:'+x)),[y,mo,d]=key.split('-'),n=Math.round(Date.UTC(+y,mo-1,+d)/864e5),b=Math.floor(n/B),first=g=>h('w'+g)%L;
  let s=first(b);
  for(let j=1;j<=n-b*B;j++){const r=h('d'+(b*B+j));
    if(j<B-1)s=(s+1+r%(L-1))%L;
    else{const nx=first(b+1),c=STAGES.map((_,i)=>i).filter(i=>i!==s&&i!==nx);s=c[r%c.length]}}
  return{stage:s,night:(h(key)>>>8)%3===0}; // 悪夢になる日は、これまでと同じ
}
try{const d=JSON.parse(localStorage.getItem(SAVE)||'{}');if(d.daily&&typeof d.daily==='object')for(const k in d.daily){const v=d.daily[k];
  if(/^\d{4}-\d\d-\d\d$/.test(k)&&v&&v.best>0)daily[k]={best:Math.floor(v.best),clear:!!v.clear,stage:STAGES[v.stage]?v.stage:0,night:!!v.night}}}catch(e){}
const curBest=()=>DAILY?(daily[DAILY]||{best:0}).best:rec().best; // いまの戦いの、これまでの最高到達波
function dailyRecord(w){ // 今日の挑戦で波を退けたときに呼ぶ
  const r=daily[DAILY]||(daily[DAILY]={best:0,clear:false,stage:STAGE,night:NIGHT});
  if(w<=r.best)return;
  r.best=w;r.clear=r.clear||w>=MAX_WAVE;
  const ks=Object.keys(daily).sort();while(ks.length>DAILY_KEEP)delete daily[ks.shift()]; // 古い日付から消す
  save();
}
let nightSel=null; // 今日の挑戦に入る前に、ステージ選択で選んでいた難易度。ステージ選択へ戻ったときに戻す（挑戦の難易度を、ふつうのステージの選択に持ちこまない）
// 実際に出す今日の挑戦。そのステージの悪夢がまだ開いていなければ、悪夢の日でも通常にする。
// その日の記録がすでにあれば、記録と同じステージ・難易度のままにする（途中で悪夢が開いても、同じ日の記録に通常と悪夢がまざらない）
function dailyNow(k=dayKey()){const r=daily[k];if(r)return{stage:r.stage,night:r.night};const c=dailyOf(k);return{stage:c.stage,night:c.night&&nightOpen(c.stage)}}

let seVol=100,bgmVol=100; // 効果音と音楽の音量（0〜100）。セーブに無いときは 100 として扱う
const volOf=x=>typeof x!=='number'||!isFinite(x)?100:Math.max(0,Math.min(100,Math.round(x)));
try{const d=JSON.parse(localStorage.getItem(SAVE)||'{}');seVol=volOf(d.seVol);bgmVol=volOf(d.bgmVol)}catch(e){}
let wiped=false; // 初期化したあと、読みこみ直すまでの間に古い進捗を書き戻さないように
function save(){if(wiped)return;try{localStorage.setItem(SAVE,JSON.stringify({disc:[...disc],madeR:[...madeR],prog,muted,musicOff,lang:LANG,tut:TUT>=9?1:0,run:RUN,stats:{...stats,time:Math.round(stats.time)},ach,daily,dmgOff,vibOff,seVol,bgmVol}))}catch(e){}}
// 途中保存：進行中の戦い（ステージ・波・魔力・灯・置いてある元素）を端末に残す。
// 取るのは「波を呼ぶ直前」「波を退けた直後」「敵がいないときに盤面を変えたとき」。
// 戦闘の途中で閉じた場合は、その波を呼ぶ直前の状態から再開になる
function saveRun(){
  if(!FX||S.over||(S.cleared&&!S.endless))return;
  RUN={stage:STAGE,night:NIGHT,wave:S.wave,mana:Math.floor(S.mana),lives:S.lives,endless:S.endless,made:[...S.made],ws:S.ws,
       items:slots.map((sl,i)=>sl.item?(sl.item.lv?[i,sl.item.id,sl.item.lv]:[i,sl.item.id]):null).filter(Boolean)};
  if(DAILY)RUN.daily=DAILY; // 今日の挑戦の途中なら、その日付も残す
  save();
}
function clearRun(){if(RUN&&FX){RUN=null;save()}}
function resumeRun(){
  const r=RUN;if(!r)return;
  const n0=NIGHT;STAGE=r.stage;NIGHT=toDiff(r.night);DAILY=/^\d{4}-\d\d-\d\d$/.test(r.daily||'')?r.daily:null;if(DAILY&&nightSel===null)nightSel=n0;reset();
  for(const sl of slots)sl.item=null;
  r.items.forEach((e,n)=>{if(!Array.isArray(e))return;const[i,id,lv]=e,sl=slots[i];if(sl&&ITEMS[id]&&fits(id,sl)){const it=mkItem(id,sl.x,sl.y);if(lv>0&&ITEMS[id].t===MAX_T)it.lv=Math.floor(lv);it.s=.01;it.hide=.1+n*.04;sl.item=it}});
  S.wave=Math.floor(r.wave);S.mana=S.manaShow=Math.floor(r.mana);S.manaFrac=0;S.lives=Math.floor(r.lives);S.endless=!!r.endless;S.cleared=S.endless;S.started=true;S.tut=9;
  S.made=new Set((Array.isArray(r.made)?r.made:[]).filter(i=>ITEMS[i]));S.ws=clamp(Math.floor(+r.ws)||1,1,6);
}
function mkItem(id,x=W/2,y=H){return{id,cd:rnd(.3),rx:x,ry:y,s:1,sv:0,kick:0,hide:0,ph:rnd(TAU),held:false,shake:0,beamT:[],chg:0,chgT:0,chgB:0}}

function musicSchedule(until,battle){
  const o=s=>({dst:MUS,...s});

    const dly=Math.max(0,musT-AC.currentTime),bar=Math.floor(musStep/8)%4,beat=musStep%8,ch=CHORDS[bar];
    musBattle+=((battle?1:0)-musBattle)*.25;const B=musBattle;

      for(const n of ch.slice(1))tone(N(n),5.4,'triangle',.02,null,dly,o({det:5,a:1.8,rev:.7,hold:2.2}));

const parts=[],fx=[];
const glowCache=new Map();
function glow(color){
  let c=glowCache.get(color);if(c)return c;
  c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,rgba(color,1));gr.addColorStop(.25,rgba(color,.55));gr.addColorStop(1,rgba(color,0));
  g.fillStyle=gr;g.fillRect(0,0,64,64);glowCache.set(color,c);return c;
}
function P(x,y,vx,vy,life,size,color,o){
  if(!FX||parts.length>2600)return;
  parts.push(Object.assign({x,y,vx,vy,life,max:life,size,color,ty:'g',g:0,drag:1.5,rot:0,vr:0},o));
}
function burst(x,y,color,n=14,sp=120,o){
  for(let i=0;i<n;i++){const a=rnd(TAU),v=rnd(sp*.25,sp);P(x,y,Math.cos(a)*v,Math.sin(a)*v,rnd(.3,.7),rnd(3,7),color,o)}
}
function sparks(x,y,color,n=8,sp=200){
  for(let i=0;i<n;i++){const a=rnd(TAU),v=rnd(sp*.3,sp);P(x,y,Math.cos(a)*v,Math.sin(a)*v,rnd(.2,.5),1.6,color,{ty:'s',drag:3})}
}
function ring(x,y,color,r1=50,dur=.4,lw=3,r0=6){if(FX)fx.push({ty:'ring',x,y,color,r0,r1,dur,lw,t:0})}
function floatText(x,y,txt,color='#e9e4f5',size=14){ // 長い文字は画面の端からはみ出さないよう寄せる
  const hw=Math.min(W/2-4,String(txt).length*size*.55);x=clamp(x,hw+4,W-hw-4);if(FX)fx.push({ty:'text',x,y,txt,color,size,t:0,dur:1})}
function shake(v){if(FX)S.shake=Math.max(S.shake,v)}
// ヒットストップ：主・王や大型の敵を倒した瞬間だけ、戦いの時間をほんの一瞬止める（火花などの演出は動き続ける）。
// 大型が続けて倒れても画面がかくつかないよう、短いものは HS_COOL ミリ秒に 1 回まで。時間は足さず、長いほうを取る
const HS_BIG=.07,HS_BOSS=.16,HS_KING=.24,HS_COOL=350;let hsLast=-1e9;
function hitStop(sec){
  if(!FX)return;const now=performance.now();
  if(sec<=HS_BIG&&now-hsLast<HS_COOL)return;
  hsLast=now;S.hitstop=Math.max(S.hitstop,sec);
}
/* ダメージの数字：敵に入った傷を、小さな数字で浮かべて消す。
   重くならないよう、敵ごとに DNUM_GAP 秒ぶんをまとめて 1 つにし（照射や燃焼は毎フレーム入るため）、同時に出すのは DNUM_MAX 個まで */
const dnums=[],DNUM_MAX=36,DNUM_GAP=.25,DNUM_LIFE=.7;
const fmtD=v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e4?Math.round(v/1e3)+'k':v>=1e3?(v/1e3).toFixed(1)+'k':Math.round(v)+'';
function dnumPop(e){
  const v=e.dn,weak=e.dnW,cur=e.dnC,syn=e.dnS;e.dn=0;e.dnW=e.dnC=e.dnS=0;e.dnT=DNUM_GAP;
  if(dmgOff||v<1||e.x<-10||e.x>W+10)return; // 設定でオフにした直後に、それまでにたまっていた数字が出ないように
  if(dnums.length>=DNUM_MAX/2&&v<e.max*.08)return;               // 半分うまったら、かすり傷の数字は出さない（群れに波動が当たったときの数字の壁を防ぐ）
  if(dnums.length>=DNUM_MAX){if(v<e.max*.2)return;dnums.shift()} // いっぱいのとき：大きい一撃だけ、いちばん古いものと入れかえる
  dnums.push({x:e.x+rnd(-e.r,e.r)*.7,y:e.y-e.r-7-(e.def.fly?16:0),txt:fmtD(v),t:0,sz:10+Math.round(clamp(v/e.max,0,1)*6),vx:rnd(-9,9),
    c:weak?'#98a6ba':syn?'#8fe6ff':cur?'#e8b8ff':'#fff6e0'}); // はじかれた＝灰色、シナジーで増えた＝水色、呪いで増えた＝紫、ふつう＝白
}

function tryCombine(a,b){
  const r=RECIPE[rkey(a.id,b.id)];
  if(r)return rankOpen(ITEMS[r].t)?{id:r}:{fail:TT('rankWait')};
  return{fail:TT('noReact')}; // ★の数がちがうものどうしは錬成できない（決まりはタイトル画面と図鑑に書いてある）
}
function dropOn(from,to){dropOn0(from,to);if(!S.active)saveRun()}
const nearCore=(x,y)=>(x-CORE.x)**2+(y-CORE.y)**2<=42*42;
function explode(sl,d){ // 火薬：まわりの影すべてに大きな威力。罠は消える
  sl.item=null;
  for(const e of S.enemies)if(!e.dead&&(e.x-sl.x)**2+(e.y-sl.y)**2<(d.splash+e.r)**2)hurt(e,d.boom,d.fam);
  if(FX){ring(sl.x,sl.y,'#ffe45c',d.splash,.45,4);ring(sl.x,sl.y,d.c,d.splash*.6,.35,3);burst(sl.x,sl.y,d.c,28,220);sparks(sl.x,sl.y,'#ffd27a',24,300);shake(6);sfx.boom();buzz(30);floatText(sl.x,sl.y-26,TT('stBoom'),'#ffd27a',FS.f2)}
}
function useRelic(sl){ // 聖灰：砦へ運ぶと消えて灯がもどる
  const it=sl.item,d=it&&ITEMS[it.id];if(!d||d.kind!=='relic')return false;
  sl.item=null;S.lives+=d.heal;S.coreHit=0;sfx.disc();buzz(20);

  floatText(CORE.x-6,CORE.y-34,TT('livesUp',d.heal),'#ffe9a0',FS.f3);

function dropOn0(from,to){
  const it=from.item;if(!it)return;
  if(!to||to===from){sfx.drop();return}
  if(!to.item){
    if(!fits(it.id,to)){it.shake=.35;sfx.fail();floatText(to.x,to.y-30,TT(ITEMS[it.id].kind==='relic'?'useOnCore':to.path?'onlyTrap':'trapOnPath'),'#b9b1d0',FS.f2);return}
    to.item=it;from.item=null;it.s=1.3;it.sv=-2;it.cd=Math.max(it.cd,.15);it.chg=0;it.chgT=0;it.chgB=0;
    sfx.drop();ring(to.x,to.y,ITEMS[it.id].c,38,.3,2);buzz(8);
    if(!to.bench)S.started=true;
    if(to.field&&S.tut<2)S.tut=2;
    return;
  }
  const res=tryCombine(it,to.item);
  if(res.fail){
    it.shake=.35;to.item.shake=.35;sfx.fail();buzz([10,40,10]);
    floatText(to.x,to.y-34,res.fail,'#b9b1d0',FS.f2);return;
  }
  // できたものが置けない場所なら、運んできた側のマスに残す
  const dst=fits(res.id,to)?to:fits(res.id,from)?from:null;
  if(!dst){it.shake=.35;sfx.fail();floatText(to.x,to.y-34,TT('mergeOnBench'),'#b9b1d0',FS.f2);return}
  const n=mkItem(res.id,dst.x,dst.y);n.hide=.3;n.s=.01;
  const isNew=!disc.has(res.id);
  if(isNew){disc.add(res.id);save()}
  if(FX)fx.push({ty:'merge',x:dst.x,y:dst.y,a:{id:it.id,x:it.rx,y:it.ry},b:{id:to.item.id,x:to.item.rx,y:to.item.ry},t:0,dur:.3,res:n,isNew});
  else n.hide=0,n.s=1;
  const rk=rkey(it.id,to.item.id); // to.item を null にする前にキーを作る
  if(RECIPE[rk]&&!madeR.has(rk)){madeR.add(rk);save()} // ★合成など、レシピ表にない組み合わせは記録しない
  from.item=null;to.item=null;dst.item=n;
  S.made.add(res.id); // 錬成した時点で「この戦いで作ったもの」に入れる（演出が終わるのを待つと、その前に取った途中保存に入らない）
  if(FX){stats.merges++;checkAch()}
}

// 戻す：直前の 1 操作（移動・錬成・還す・呼び出し・工房レベル・強化・聖灰）だけを取り消す。
// 操作の前後でマスの中身を覚えておき、いまの盤面が操作した直後のままのときだけ戻せる（罠が弾けた、などで変わっていたら戻さない）。
// 魔力と灯は、その操作で増減した分だけを戻す（波の最中に倒して得た魔力は残す）。
// 波が始まった・終わったあとは戻せない（波の間だけ塔を置いて、終わってから戻して魔力を取り返す、ができないように）
const undoSnap=()=>({items:slots.map(s=>s.item),lv:slots.map(s=>s.item&&s.item.lv||0),mana:S.mana,lives:S.lives,ws:S.ws,made:new Set(S.made)});
function undoable(fn){
  const b=undoSnap(),r=fn(),a=undoSnap();
  if(a.items.some((x,i)=>x!==b.items[i])||a.lv.some((v,i)=>v!==b.lv[i])||a.ws!==b.ws||a.mana!==b.mana||a.lives!==b.lives)UNDO={b,a,dm:a.mana-b.mana,dl:a.lives-b.lives,w:S.wave,act:S.active};
  return r;
}
const canUndo=()=>!!UNDO&&!S.over&&S.wave===UNDO.w&&S.active===UNDO.act&&!(S.cleared&&!S.endless)&&slots.every((s,i)=>s.item===UNDO.a.items[i]&&(s.item&&s.item.lv||0)===UNDO.a.lv[i])&&S.ws===UNDO.a.ws&&S.mana-UNDO.dm>=0&&S.lives-UNDO.dl>0;

  const b0=btn('undo'),bx=b0.x+b0.w/2;

  const{b,a,dm,dl}=UNDO;UNDO=null;sel=null;
  slots.forEach((s,i)=>{const it=b.items[i];s.item=it;if(!it)return;
    if(b.lv[i])it.lv=b.lv[i];else delete it.lv;
    if(a.items[i]!==it||a.lv[i]!==b.lv[i]){it.held=false;it.hide=0;it.fly=0;it.s=.6;it.sv=6;it.shake=0}});
  S.mana-=dm;S.lives-=dl;S.ws=b.ws;S.made=b.made;S.manaBump=1;
  if(dm)floatText(W-74,48,(dm>0?'−':'+')+Math.abs(dm),dm>0?'#ffb89a':'#e8c36a',FS.f2);
  sfx.drop();tone(520,.12,'sine',.05,330);buzz(8);floatText(clamp(bx,70,W-70),b0.y-8,TT('undone'),'#cfc8e6',FS.f1);
  if(!S.active)saveRun();
}

function startWave(){
  if(S.active&&!S.over){openPause();return} // 波の最中に波のボタン／Space を押すと一時停止
  if(S.active||S.over||(S.cleared&&!S.endless))return;
  saveRun();
  if(S.wave===0&&FX)stats.plays++; // 最初の波を呼んだときに 1 回と数える（途中保存からの再開は数えない）
  S.wave++;S.active=true;S.wt=0;S.started=true;
  if(S.tut<3)S.tut=3;if(S.wave>=3&&S.tut<9)tutDone();
  S.queue=buildWave(S.wave);
  {const st=STAGES[STAGE];if(S.wave===1&&st.aff&&FX)fx.push({ty:'text',x:W/2,y:130,txt:affText(st),color:st.aff.c||'#6ab8ff',size:13,t:0,dur:5})} // 属性の地：最初の波で弱点を知らせる
  S.wsum=S.queue.reduce((a,q)=>a+ENEMY[q.type].w,0);S.budget=26+9*S.wave;
  const bq=S.queue.find(q=>q.type==='boss');S.bossAt=bq?bq.at:null;S.warnFinal=!!(bq&&bq.final);S.warned=false;
  sfx.wave(S.wave);if(FX)fx.push({ty:'wave',t:0,dur:1.6,n:S.wave});
}

/* 主・王の段階：体力が半分を切ると怒り、足が速まり、入口から手下を呼ぶ。夜の王は 25% でさらに激昂し、灯への攻撃も早くなる。
   怒ると守りが甘くなり、受ける傷が同じ割合で増える（vul）。速くなったぶん早く倒れるので、倒れるまでに進む道のりはこれまでと変わらない */
const BOSS_BORN=.7,WARN_T=2.6,WARN_LEAD=2.4; // 現れるときにふくらむ秒数／警告を出している秒数／現れる何秒前から警告するか
const BOSS_PH=[{spd:1,atk:1,vul:1},{at:.5,spd:1.15,atk:1,vul:1.15,call:4},{at:.25,spd:1.3,atk:.85,vul:1.3,call:6}]; // 3 段階目（体力 25%）は夜の王だけ
function bossPhase(e){
  const k=e.hp/e.max,np=e.final&&k<=BOSS_PH[2].at?3:k<=BOSS_PH[1].at?2:1;
  if(np<=e.phase)return;
  const ph=BOSS_PH[np-1];e.phase=np;e.spdM=ph.spd;e.vul=ph.vul;e.atkEvery=SIEGE_EVERY*ph.atk;e.rageT=1;

  floatText(e.x,e.y-e.r-26,TT(np>2?'bossFury':'bossRage')+'！','#ffb070',FS.f3);
  fx.push({ty:'text',x:W/2,y:96,txt:TT('rageNote',nm2),color:'#ffb070',size:13,t:0,dur:3.2});

/* 属性シナジー：水の直撃で「濡れ」→雷が、氷の直撃で「脆化」→土が、それぞれ SYN_MUL 倍。ボスは持続が半分。状態は戦闘中のみ（セーブには入れない） */
const SYN_MUL=1.5,SYN_T=2.5;
const AMP_MUL=2; // 系統の結界：輪の中の影が、その系統から受ける傷の倍率
function ampAt(e,fs){ // 影がいる場所の系統の結界の倍率（同じ系統の結界は重ならない）
  if(!S.amps||!S.amps.length)return 1;
  for(const a of S.amps)if(fs.includes(a.f)&&(e.x-a.x)**2+(e.y-a.y)**2<=a.r2)return AMP_MUL;
  return 1;
}
function hurt(e,dmg,fam){ // fam：攻撃した元素の系統（配列。どれか 1 つが当てはまれば鎧・結界・シナジーが働く）
  if(e.dead)return;

        if(ad.slow){flakes(p[0],p[1],2,70);ring(p[0],p[1],'#bfeaff',18,.3,2)}}}
    sfx.shoot(ad);return;
  }
  if(ad.kind==='pierce'){
    const a=Math.atan2(tg.y-y,tg.x-x),L=R*1.25,ex=x+Math.cos(a)*L,ey=y+Math.sin(a)*L,pHit=[];
    for(const e of S.enemies){if(e.dead)continue;
      const k=clamp(((e.x-x)*(ex-x)+(e.y-y)*(ey-y))/(L*L),0,1),px=x+(ex-x)*k,py=y+(ey-y)*k;
      if((e.x-px)**2+(e.y-py)**2<(e.r+9)**2){pHit.push(e);applyHit(e,ad,m,ad.c);hurt(e,ad.dmg*m,ad.fam);if(FX)sparks(e.x,e.y,ad.c,3,140)}}
    if(ad.rico&&pHit.length){const hs=new Set(pHit),src=pHit[0];spawnRico(src.x,src.y,ad,m,ad.rico,hs)}
    if(FX)pierceFx(VIS[ad.id],x,y,ex,ey,ad,a);sfx.shoot(ad);return;
  }
  const vis=VIS[ad.id]||'orb',sh={x,y,tx:tg.x,ty:tg.y,tg,d:ad,m,vis,h:0,a:Math.atan2(tg.y-y,tg.x-x),rot:rnd(TAU),seed:rnd(99),
    spd:ad.fast?900:vis==='bullet'?720:vis==='blade'?560:LOB[vis]?310:ad.splash?350:480,rico:ad.rico||0,hit:ad.rico?new Set():null};
  if(vis==='meteor'){sh.x=tg.x-100;sh.y=tg.y-330;sh.spd=640}                 // 終焉：空から落ちてくる
  if(vis==='snipe'&&FX)fx.push({ty:'line',x,y,ex:tg.x,ey:tg.y,color:ad.c,t:0,dur:.14});
  sh.d0=Math.max(30,Math.hypot(tg.x-sh.x,tg.y-sh.y));S.shots.push(sh);
  sfx.shoot(ad);
}
function shotHit(s){
  const d=s.d,dm=d.dmg*s.m;
  if(d.splash){sfx.hit(d);
    for(const e of S.enemies){if(e.dead)continue;if((e.x-s.x)**2+(e.y-s.y)**2<(d.splash+e.r)**2){if(s.hit)s.hit.add(e);applyHit(e,d,s.m,d.c);hurt(e,dm,d.fam)}}
    if(s.rico>0){if(!s.hit)s.hit=new Set();if(s.tg)s.hit.add(s.tg);spawnRico(s.x,s.y,d,s.m,s.rico,s.hit)}
  }else if(s.tg&&!s.tg.dead){
    const e=s.tg,hx=e.x,hy=e.y;if(s.hit)s.hit.add(e);
    applyHit(e,d,s.m,d.c);hurt(e,dm,d.fam);
    if(s.rico>0){if(!s.hit)s.hit=new Set([e]);spawnRico(hx,hy,d,s.m,s.rico,s.hit)}
  }else return;
  if(FX)impact(s);
}
function update(dt){
  S.time+=dt;
  if(S.echoes&&S.echoes.length){for(const o of S.echoes){o.t-=dt;if(o.t>0)continue;o.done=true;for(const e of inRange(o.x,o.y,o.R)){applyHit(e,o.ad,o.m,o.ad.c);hurt(e,o.ad.dmg*o.m*ECHO_POW,o.ad.fam)}if(FX){pulseFx(VIS[o.ad.id],o.x,o.y,o.R*.85,o.ad);sfx.shoot(o.ad)}}S.echoes=S.echoes.filter(o=>!o.done)}
  if(S.active){
    S.wt+=dt;
    if(S.bossAt!==null&&!S.warned&&S.wt>=S.bossAt-WARN_LEAD){S.warned=true;if(FX){S.warn=WARN_T;sfx.warn();buzz([60,80,60,80,60])}} // 主が現れる少し前に警告
    while(S.queue.length&&S.queue[0].at<=S.wt)spawnEnemy(S.queue.shift());
  }
  for(const e of S.enemies){
    if(e.dead)continue;
    if(e.knT>0)e.knT-=dt;if(e.kb>0)e.kb-=dt;if(e.mirT>0)e.mirT-=dt;if(e.hazT>0)e.hazT-=dt;
    if(e.stopT>0)e.stopT-=dt;if(e.stopRes>0)e.stopRes-=dt;
    if(e.slowT>0&&!(e.stopT>0))e.slowT-=dt; // 停止中は減速タイマーを進めない（停止明けに効く）
    if(e.curseT>0){e.curseT-=dt;if(e.curseT<=0)e.curse=1}if(e.silT>0)e.silT-=dt;
    if(STAGES[STAGE].aff&&STAGES[STAGE].aff.wet)e.wetT=9;else if(e.wetT>0)e.wetT-=dt;if(e.britT>0)e.britT-=dt; // 沈んだ都：影はいつも濡れている
    if(e.dotT>0){e.dotT-=dt;hurt(e,e.dot*dt,e.dotF);if(e.dead)continue;e.flash=0;
      if(FX&&Math.random()<dt*10){if(e.dotK)P(e.x+rnd(-e.r,e.r),e.y+rnd(-e.r,e.r)*.5,rnd(-6,6),rnd(-40,-20),.6,rnd(1.8,3),'#a8f06a',{ty:'w',g:-20,drag:.5});else flameP(e.x,e.y-e.r*.3,'#ff7a3a',1,e.r*.7)}}
    if(e.flash>0)e.flash-=dt;
    if(e.dn>0){e.dnT=(e.dnT||0)-dt;if(e.dnT<=0)dnumPop(e)}
    if(e.block>0)e.block-=dt;if(e.healed>0)e.healed-=dt;if(e.pulse>0)e.pulse-=dt*1.6;
    if(e.def.heal&&!(e.silT>0)){e.healT-=dt; // 癒す影：まわりの傷ついた影を治す（沈黙中は回復しない）
      if(e.healT<=0){e.healT=HEAL_EVERY;let n=0;
        for(const o of S.enemies){if(o===e||o.dead||o.def.heal||o.type==='boss'||o.hp>=o.max||(o.x-e.x)**2+(o.y-e.y)**2>HEAL_R*HEAL_R)continue;
          o.hp=Math.min(o.max,o.hp+o.max*e.def.heal);o.healed=.6;n++}
        e.pulse=n?1:.35;if(n&&FX)ring(e.x,e.y,'#9affc8',HEAL_R,.5,2,10)}}
    if(e.born>0)e.born-=dt;if(e.rageT>0)e.rageT-=dt;
    if(e.phase>1&&FX&&Math.random()<dt*(e.phase>2?22:12))flameP(e.x+rnd(-e.r,e.r)*.8,e.y-e.r*.4,e.phase>2?'#ffb040':'#ff5a2a',1,5); // 怒った主は炎をまとう
    const stopped=e.stopT>0||(e.slowT>0&&e.slow>=1);
    e.d+=e.def.spd*(e.spdM||1)*(stopped?0:e.slowT>0?1-e.slow*(1-(e.def.res||0)):1)*dt;
    if(e.d>=e.P.len){
      if(e.type!=='boss'){leak(e);continue}
      // 主・王は通り抜けず、灯の前に居すわって攻撃する。その間に倒せば被害はそこまで
      e.d=e.P.len;if(!e.siege){e.siege=true;e.atk=SIEGE_FIRST;e.hits=0;if(FX){floatText(CORE.x-60,CORE.y-46,TT('siege'),'#ff8a9a',FS.f2);sfx.wave(5)}}
      if(!stopped)e.atk-=dt;if(e.lunge>0)e.lunge-=dt*4;
      if(!stopped&&e.atk<=0){e.atk+=e.atkEvery||SIEGE_EVERY;siegeHit(e);if(e.dead)continue}
    }else e.siege=false;
    const p=pathPoint(e.P,e.d);e.x=p[0];e.y=p[1];
  }
  calcBuffs();wardTick(dt);
  for(const sl of slots){
    const it=sl.item;if(!it)continue;
    if(it.hide>0||it.held||sl.bench){it.beamT.length=0;continue}
    if(sl.path){ // 罠：上を通る敵にかかり続ける
      const d=ITEMS[it.id];
      if(d.boom){if(S.enemies.some(e=>!e.dead&&!e.def.fly&&(e.x-sl.x)**2+(e.y-sl.y)**2<(d.range+e.r*.5)**2))explode(sl,d);continue} // 火薬：踏まれたら爆ぜて消える
      for(const e of S.enemies){if(!e.dead&&!e.def.fly){if((e.x-sl.x)**2+(e.y-sl.y)**2<(d.range+e.r*.5)**2)applyHit(e,d,enhM(it),d.c,sl);else if(e._mirSl===sl)e._mirSl=null}} // 飛ぶ敵は罠にかからない
      continue;
    }
    towerFire(sl,it,dt);
  }
  for(const s of S.shots){
    if(s.tg&&!s.tg.dead){s.tx=s.tg.x;s.ty=s.tg.y}
    const dx=s.tx-s.x,dy=s.ty-s.y,l=Math.hypot(dx,dy),st=s.spd*dt;
    if(l<=st+4){s.x=s.tx;s.y=s.ty;shotHit(s);s.done=true}
    else{s.x+=dx/l*st;s.y+=dy/l*st;s.a=Math.atan2(dy,dx);s.rot+=dt*9;
      s.h=LOB[s.vis]?Math.sin(Math.PI*clamp(1-l/s.d0,0,1))*Math.min(70,s.d0*.42):0;if(FX)shotTrail(s)}
  }
  S.shots=S.shots.filter(s=>!s.done);
  S.enemies=S.enemies.filter(e=>!e.dead);
  if(S.active&&!S.queue.length&&!S.enemies.length&&!S.over)endWave();
}
function endWave(){
  S.active=false;S.warn=0;const bonus=12+3*S.wave;S.mana+=bonus;
  if(FX)stats.waves++;
  if(DAILY)dailyRecord(S.wave);
  else if(S.wave>rec().best){prog[pkey()]={best:S.wave,clear:rec().clear||S.wave>=MAX_WAVE};save()}
  if(FX)checkAch();
  floatText(W/2,300,TT('waveDone',S.wave),'#ffe9a0',FS.f4);floatText(W/2,328,TT('manaPlus',bonus),'#e8c36a',FS.f2);
  sfx.waveEnd();
  if(FX)for(let i=0;i<5;i++)fx.push({ty:'mana',x:W/2+rnd(-40,40),y:330,cx:W/2+rnd(-80,80),cy:200,t:-i*.06,dur:.7});
  if(S.wave===MAX_WAVE&&!S.endless){clearRun();S.newBase=DAILY?null:checkUnlock();if(FX)save();victory()}else saveRun();
}

const FW=['#ffe9a0','#ff9ae0','#8fe6ff','#b98cff','#7df0c0','#ff6a3d','#ffffff','#ffd23c'];
function victory(){
  S.cleared=true;S.cele=.0001;S.slowmo=0;S.flash=1;S.flashC='#fff6d8';shake(14);
  if(!FX)return;
  if(!DAILY&&S.lives>=DIFF[NIGHT].lives)grantAch('flawless'); // 今日の挑戦のクリアは数えない（「はじめての夜明け」などと同じ扱い）
  sfx.clear();buzz([40,60,40,60,120]);
  // 置いてある塔すべてから光の柱
  for(const sl of slots)if(sl.item){const c=ITEMS[sl.item.id].c;ring(sl.x,sl.y,c,90,.9,4);
    for(let i=0;i<26;i++)P(sl.x+rnd(-8,8),sl.y,rnd(-25,25),rnd(-520,-160),rnd(.6,1.4),rnd(4,8),c,{drag:.6});sl.item.sv=10}
  for(let i=0;i<7;i++)ring(W/2,300,FW[i],140+i*60,.8+i*.14,5,10);
  for(let i=0;i<160;i++)confetti(rnd(W),rnd(-260,0));

}
function confetti(x,y){

  }
  if(kind>.6)for(let i=0;i<24;i++){const a=rnd(TAU),v=rnd(20,90);P(x,y,Math.cos(a)*v,Math.sin(a)*v,rnd(1.4,2.4),3,'#ffe9a0',{g:70,drag:.7,tw:1})}

function celebrate(dt){

/* ---------------- 入力 ---------------- */
let drag=null,sel=null,pressed=null,strip=null,ptr={x:0,y:0},lpT=null,INFO_R=null,ENH_R=null,ENH_R0p=0;
const LONG_MS=480; // これだけ押し続けると詳細を開く
const lpClear=()=>{if(lpT){clearTimeout(lpT);lpT=null}};
function pos(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H}}
const slotAt=(x,y,need)=>{let b=null,bd=40*40;for(const s of slots){if(need&&!s.item)continue;const q=(s.x-x)**2+(s.y-y)**2;if(q<bd){bd=q;b=s}}return b};
const inBtn=(b,x,y)=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
// 2 本目以降の指は無視する（1 本目でつまんでいる間に別の元素へ触れると、先の元素が「つまんだまま」になって攻撃しなくなるため）
const extraPtr=ev=>!!ev&&ev.isPrimary===false;
cv.addEventListener('pointerdown',ev=>{
  audio();if(extraPtr(ev))return;
  const p=pos(ev);ptr=p;
  try{cv.setPointerCapture(ev.pointerId)}catch(e){}
  if(S.over||(S.cleared&&!S.endless))return;
  if(S.banner&&S.banner.t>.4){S.banner.t=Math.max(S.banner.t,S.banner.dur-.25)}
  ring(p.x,p.y,'#8b5cf6',18,.3,1.5,2);
  if(INFO_R&&sel&&sel.item&&inBtn(INFO_R,p.x,p.y)){buzz(12);openDetail(INFO_R.id,'game');return}
  if(ENH_R&&sel&&canEnh(sel.item)&&inBtn(ENH_R,p.x,p.y)){ENH_R0p=1;undoable(()=>enhance(sel));return}
  const tb=p.y>=TABS[0].y-3&&p.y<TABS[0].y+TABS[0].h+2&&TABS.find(t=>p.x>=t.x-3&&p.x<=t.x+t.w+3);
  if(tb){if(tb.t==='f'){sfx.ui();openFilter();return}sfx.ui();if(FLT.rank.size===1&&FLT.rank.has(tb.t))setRank([]);else{setRank([tb.t]);wsHint(tb.t)}return}
  if(inBtn(SHOP,p.x,p.y)){strip={sx:p.x,sy:p.y,s0:SHOP.scroll[SHOP.tab],moved:false,touch:ev.pointerType==='touch',i:Math.floor((p.x-SHOP.x+SHOP.scroll[SHOP.tab])/SHOP.pitch)};
    SHOP.press=strip.i;SHOP.pressT=1;
    lpClear();lpT=setTimeout(()=>{if(strip&&!strip.moved){const d=shopList(SHOP.tab)[strip.i];if(d&&!d.ws&&disc.has(d.id)){strip=null;SHOP.press=null;buzz(12);openDetail(d.id,'game')}}},LONG_MS);
    return}
  const b=buttons.find(b=>inBtn(b,p.x,p.y));
  if(b){pressed=b;b.p=1;return}
  const s=slotAt(p.x,p.y,true);
  if(s&&s.item.hide<=0){drag={slot:s,item:s.item,sx:p.x,sy:p.y,moved:false,touch:ev.pointerType==='touch'};s.item.held=true;s.item.sv=5;sfx.pick();buzz(5);
    lpClear();lpT=setTimeout(()=>{if(drag&&!drag.moved){const id=drag.item.id;drag.item.held=false;drag=null;sel=null;buzz(12);openDetail(id,'game')}},LONG_MS);
    return}
  if(sel){const t=slotAt(p.x,p.y),f=sel;undoable(()=>{if(t)dropOn(f,t);else if(nearCore(p.x,p.y))useRelic(f)});sel=null}
});
cv.addEventListener('pointermove',ev=>{
  if(extraPtr(ev))return;
  const p=pos(ev);ptr=p;
  if(strip){const dx=p.x-strip.sx,dy=p.y-strip.sy;
    // 縦に引いたら、その元素をつかむ（横に引いたら列を流す）。流せない列ならどちらへ引いてもつかむ。
    // 斜めに引いて列が流れはじめても、指が列の上へ出たらつかむ（列は指について動くので、押した元素が指の下にある）
    if(!strip.moved&&Math.hypot(dx,dy)>10&&(Math.abs(dy)>Math.abs(dx)*.6||shopMax(SHOP.tab)<1)||strip.moved&&p.y<SHOP.y-12){
      const d=shopList(SHOP.tab)[strip.i];
      if(d&&!d.ws&&canBuy(d.id)){const st=strip;strip=null;SHOP.press=null;lpClear();
        if(S.mana<itemValue(d)){S.manaErr=.5;sfx.fail();floatText(W-110,48,TT('noMana'),'#ff8a9a',FS.f1);return}
        const it=mkItem(d.id,p.x,p.y);it.held=true;it.sv=5;drag={shop:d.id,slot:{x:shopBtnX(st.i)+SHOP.bw/2,y:SHOP.y+SHOP.h/2,item:it},item:it,sx:p.x,sy:p.y,moved:true,touch:st.touch};sfx.pick();buzz(5);return}}}
  if(strip){const dx=p.x-strip.sx;if(Math.abs(dx)>8){strip.moved=true;SHOP.press=null;lpClear()}
    if(strip.moved)SHOP.scroll[SHOP.tab]=clamp(strip.s0-dx,0,shopMax(SHOP.tab))}
  if(drag&&!drag.moved&&Math.hypot(p.x-drag.sx,p.y-drag.sy)>9){drag.moved=true;sel=null;lpClear()}
});
function release(ev,cancel){
  lpClear();
  const p=ev?pos(ev):ptr;
  if(strip){const st=strip;strip=null;SHOP.press=null;
    if(cancel||st.moved)return;
    const d=shopList(SHOP.tab)[st.i];if(!d)return;
    const bx={x:shopBtnX(st.i),y:SHOP.y,w:SHOP.bw,h:SHOP.h};
    if(d.ws){undoable(()=>upgradeWs(d.ws,bx));return}
    if(disc.has(d.id)&&!canBuy(d.id)){sfx.fail();floatText(clamp(p.x,70,W-70),SHOP.y-10,TT('needMake',d.t),'#b9b1d0',FS.f1);return}
    if(!disc.has(d.id)){sfx.fail();floatText(clamp(p.x,70,W-70),SHOP.y-10,UNLOCK[d.id]!==undefined?TT('unlockAt',sn(STAGES[UNLOCK[d.id]])):TT('findFirst'),'#b9b1d0',FS.f1);return}
    sfx.ui();floatText(clamp(p.x,90,W-90),SHOP.y-10,TT('dragBuy'),'#cfc8e6',FS.f1);return} // 押しただけでは呼び出さない（つかんで運ぶ）
  if(pressed){const b=pressed;pressed=null;if(!cancel&&inBtn(b,p.x,p.y))press(b);return}
  if(!drag)return;
  const d=drag;drag=null;d.item.held=false;
  if(cancel)return;
  if(d.shop){const tb=btn('trash');if(inBtn(tb,p.x,p.y)){sfx.drop();return}undoable(()=>buyDrop(d.shop,p,d.touch));return} // 一覧からつかんだ元素
  if(!d.moved){ // タップ：選択の切りかえ、または選択中の元素をここへ
    if(sel&&sel!==d.slot){const f=sel;undoable(()=>dropOn(f,d.slot));sel=null}
    else sel=sel===d.slot?null:d.slot;
    return;
  }
  const tb=btn('trash');
  if(inBtn(tb,p.x,p.y)){undoable(()=>sell(d.slot));return}
  const ty=p.y-(d.touch?26:0);
  if(ITEMS[d.item.id].kind==='relic'&&!slotAt(p.x,ty)&&nearCore(p.x,ty)){undoable(()=>useRelic(d.slot));return}

async function share(btn,kind){
  const L=shareLines(kind),text=LANG==='ja'?`${L.title}｜${L.st}${L.res?' '+L.res:''}・${L.found}`:`${L.title} | ${L.st}${L.res?' — '+L.res:''} · ${L.found}`;
  const done=msg=>{const o=btn.textContent;btn.textContent=msg;btn.classList.add('done');setTimeout(()=>{btn.textContent=o;btn.classList.remove('done')},1800)};
  sfx.ui();
  let file=null;
  try{const blob=await new Promise(r=>shareCard(kind).toBlob(r,'image/png'));if(blob)file=new File([blob],'yoiyami.png',{type:'image/png'})}catch(e){}
  try{
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:text+'\n'+SITE});return}
    if(navigator.share){await navigator.share({text,url:SITE});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  // 共有の画面が出せない環境（PC など）は、文章をコピーして画像を保存する
  try{await navigator.clipboard.writeText(text+'\n'+SITE);done(TT('copied'))}catch(e){window.prompt(TT('copyThis'),text+' '+SITE)}
  if(file){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download='yoiyami.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
}
