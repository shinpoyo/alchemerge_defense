<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>アルケマージ・ディフェンス — 元素を重ねて守る、マージ×タワーディフェンス</title>
<meta name="description" content="火・水・土・風を重ねて新しい元素を錬成し、できた元素で砦を守るマージ×タワーディフェンス。登録なし・無料で、ブラウザですぐ遊べます。">
<meta property="og:type" content="website">
<meta property="og:title" content="アルケマージ・ディフェンス — 元素を重ねて守る、マージ×タワーディフェンス">
<meta property="og:description" content="元素を重ねて錬成し、できた元素で砦を守る。全198種の元素を見つけて、20の夜波を越えよう。">
<meta property="og:url" content="https://shinpoyo.com/alchemerge_defense/">
<meta name="theme-color" content="#050409">
<link rel="canonical" href="https://shinpoyo.com/alchemerge_defense/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090712'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%238b5cf6' stroke-width='3'/%3E%3Cpath d='M32 16l14 24H18z' fill='none' stroke='%23e8c36a' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c"></canvas>

  <div class="ov on" id="title">
    <h1 id="t1"></h1>
    <div class="sub">MERGE × TOWER DEFENSE</div>
    <ul class="how" id="how">
      <li><i>一</i>下の一覧から<b>火・水・土・風</b>を呼び出す。<b>作った元素</b>も、その戦いの間は呼び出せる</li>
      <li><i>二</i><b>★の数が同じ</b>元素を<b>重ねる</b>と新しい元素に。<b>おなじもの同士</b>でも変わる（水＋水＝池）</li>
      <li><i>三</i>できた元素を<b>魔法陣</b>に置くと塔になる。沼などの<b>罠は道の上</b>に置く</li>
      <li><i>四</i><b>20 の夜波</b>を退ければ夜明け。元素は全 54 種、★はランク</li>
    </ul>
    <button class="b" id="bStart">はじめる</button>
    <button class="b s" id="bLang">English</button>
  </div>

  <div class="ov" id="stages">
    <h2 id="hStages">ステージ</h2>
    <div class="diff"><button class="b s" id="dNorm">通常</button><button class="b s" id="dNight">悪夢</button><button class="b s" id="dAbyss">深淵</button></div>
    <div id="dNote"></div>
    <div id="slist"></div>
    <div id="sNav"><button class="b s" id="sAch"></button><button class="b s" id="sStats"></button></div>
  </div>

  <div class="ov" id="ach">
    <h2 id="hAch">実績</h2>
    <div id="aCnt"></div>
    <div class="sbody" id="aBody"></div>
    <button class="b s" id="aClose">とじる</button>
  </div>

  <div class="ov" id="stats">
    <h2 id="hStats">統計</h2>
    <div class="sbody" id="stBody"></div>
    <button class="b s" id="stClose">とじる</button>
  </div>

  <div class="ov" id="detail">
    <div id="dBody"></div>
    <div class="dnav"><button class="b s" id="dPrev">‹ 前へ</button><button class="b s" id="dClose">とじる</button><button class="b s" id="dNext">次へ ›</button></div>
  </div>

  <div class="ov" id="menu">
    <h2 id="hMenu">設定</h2>
    <button class="b s m" id="mCodex"></button>
    <button class="b s m" id="mSound"></button>
    <label class="vol" id="vSe"><span id="lSe"></span><input type="range" id="rSe" min="0" max="100" step="5"><b id="nSe"></b></label>
    <button class="b s m" id="mMusic"></button>
    <label class="vol" id="vBgm"><span id="lBgm"></span><input type="range" id="rBgm" min="0" max="100" step="5"><b id="nBgm"></b></label>
    <button class="b s m" id="mDmg"></button>
    <button class="b s m" id="mVib"></button>
    <button class="b s m" id="mLang"></button>
    <div class="mrow"><button class="b s" id="mAch"></button><button class="b s" id="mStats"></button></div>
    <button class="b s m" id="mStages"></button>
    <button class="b m" id="mClose"></button>
    <button class="lnk" id="mReset"></button>
  </div>

  <div class="ov" id="flt"><div class="fp" id="fltP">
    <div class="fps" id="fltPs"></div>
    <h4 id="fhRank"></h4><div class="chips" id="fRank"></div>
    <h4 id="fhFam"></h4><div class="chips" id="fFam"></div>
    <h4 id="fhPlace"></h4><div class="chips" id="fPlace"></div>
    <h4 id="fhRole"></h4><div class="chips" id="fRole"></div>
    <h4 id="fhSort"></h4><div class="chips" id="fSort"></div>
    <button class="tg" id="fOnly"><span id="fOnlyL"></span><i></i></button>
    <div class="ft"><button class="lnk" id="fReset"></button><button class="b s" id="fClose"></button></div>
  </div></div>
  <div class="ov" id="pause"><h2 id="hPause"></h2><div id="pMoon"></div><button class="b m" id="pResume"></button></div>
  <div class="ov" id="moon"><h2 id="hMoon"></h2><div id="moonSub"></div><div id="moonCards"></div></div>
  <div class="ov red" id="wipe">
    <h2 id="hWipe"></h2>
    <div class="wipeTxt" id="wipeTxt"></div>
    <button class="b s danger" id="wYes"></button>
    <button class="b s" id="wNo"></button>
  </div>

  <div class="ov" id="codex">
    <h2 id="hCodex">錬金図鑑</h2>
    <div id="cnt"></div>
    <button id="cfb"></button>
    <div id="grid"></div>
    <div><button class="b s" id="bShare3">図鑑を共有</button><button class="b s" id="bClose">とじる</button></div>
  </div>

  <div class="ov red" id="over">
    <h1 id="hOver">陥 落</h1>
    <div class="sub" id="overSub"></div>
    <button class="b" id="bRetry">もう一度</button>
    <div><button class="b s" id="bShare2">結果を共有</button><button class="b s" id="bStages1">ステージ選択</button></div>
  </div>

  <div class="ov clear" id="clear">
    <h1 class="big" id="t2"></h1>
    <div class="sub" id="clearSub"></div>
    <button class="b" id="bEndless">さらに夜を越える</button>
    <div><button class="b s" id="bShare1">結果を共有</button><button class="b s" id="bAgain">ステージ選択</button></div>
  </div>

  <div class="ov" id="baseGet">
    <div class="bgDim"></div><canvas id="bgFx"></canvas>
    <div class="bgIco" id="bgIco"><canvas id="bgOrb" width="240" height="240"></canvas></div>
    <div class="bgTxt"><div class="bgSub" id="bgSub"></div><div class="bgName" id="bgName"></div></div>
    <div class="bgHint" id="bgHint"></div>
  </div>

  <div id="toast"><i>✦</i><div><small id="toH"></small><b id="toB"></b></div></div>
</div></div>

<!-- ゲームの本体。上から順に読みこむ（あとのファイルは前のファイルの定義を使う） -->
<script src="js/core.js"></script>
<script src="js/data/lang.js"></script>
<script src="js/data/elements.js"></script>
<script src="js/data/stages.js"></script>
<script src="js/shop.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/effects.js"></script>
<script src="js/icons.js"></script>
<script src="js/merge.js"></script>
<script src="js/battle.js"></script>
<script src="js/moon.js"></script>
<script src="js/clear.js"></script>
<script src="js/input.js"></script>
<script src="js/screens.js"></script>
<script src="js/render.js"></script>
<script src="js/sprites.js"></script>
<script src="js/main.js"></script>
</body>
</html>
